name: VOX3

on:
  push:
    branches:
      - vox3
      - dev-ai-contest-2026
  workflow_dispatch:
  # Fallback: if push events from this fork are not auto-firing (GitHub's
  # forked-repo workflow policy can suppress push-triggered runs), the build
  # still kicks off on its own every 15 minutes.  Harmless for a non-fork repo.
  schedule:
    - cron: '*/15 * * * *'

# Without this the GITHUB_TOKEN cannot push the vox3-log / vox3-fw branches,
# and every publish step silently no-ops (|| echo "WARN") — which is exactly
# why no marker branch appeared after the first pushes.  Read+write is required
# for the build script to `git push` firmware/log to branches.
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MANIFEST_BRANCH: dev-ai-contest-2026
      SYNC_DEPTH: '1'

    steps:
      # Prove the run really started, and leave a trace on the vox3-log branch
      # immediately.  A previous push produced neither vox3-fw nor vox3-log,
      # which is indistinguishable from "the workflow never ran"; this step
      # makes the two cases tellable apart.
      #
      # IMPORTANT: this step runs BEFORE actions/checkout, so there is no git
      # repo here yet.  All `git rev-parse HEAD` calls must tolerate failure.
      # The fresh `.announce` directory is also a brand-new repository; in Git
      # you cannot `git checkout -B` on a repo with no commits, so we use an
      # orphan branch instead.
      - name: Announce start
        run: |
          set -x
          git config --global user.email "vox3-ci@users.noreply.github.com"
          git config --global user.name  "vox3-ci"
          COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "?")
          BRANCH=${GITHUB_REF:-?}
          STARTED=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "commit:   $COMMIT"
          echo "branch:   $BRANCH"
          echo "started:  $STARTED"
          echo "runner:   $(uname -a)"
          mkdir -p .announce
          {
            echo "commit:  $COMMIT"
            echo "branch:  $BRANCH"
            echo "started: $STARTED"
            echo "files:"
            # NOTE: this runs BEFORE actions/checkout, so the workspace is
            # empty and `ls` returns exit code 2 ("No such file") which would
            # kill the step under the default `bash -e`.  Guard it.
            ls -l build_vox3.sh patches/nuttx/drivers/audio/es8311.c \
                   patches/nuttx/boards/xtensa/esp32s3/esp32s3-eye/src/esp32s3-eye.h \
                   defconfigs/ai_vox3_defconfig 2>&1 || true
          } > .announce/announce.txt
          cd .announce
          git init --quiet .
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --quiet --orphan vox3-log
          git add -A
          git commit -q -m "vox3 run started: ${COMMIT:0:8} @ $(date -u '+%H:%M:%SZ')" || true
          # --quiet hides nothing important; keep push output VISIBLE so a
          # rejected GITHUB_TOKEN push can be diagnosed from the run log.
          git push --force origin vox3-log 2>&1 || echo "WARN: announce push failed"

      - name: Checkout (patches + defconfig + build script)
        uses: actions/checkout@v4
        with:
          # The build content (patches, defconfig, build script) lives on the
          # vox3 branch; the workflow itself is also present on the default
          # branch so it is visible/triggerable in the Actions UI.  Always
          # build from vox3 regardless of which branch fired the event.
          ref: vox3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h || true

      - name: Build AI-VOX3 v0.1 firmware
        run: bash build_vox3.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: vox3-firmware
          path: firmware/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vox3-log
          path: build_vox3.log
          if-no-files-found: ignore

      # Last-resort evidence: if the build died before its own ERR trap could
      # publish (killed step, cancelled job, runner loss), the announce commit
      # above plus this marker still show the run reached the build step.
      - name: Publish failure marker
        if: failure()
        run: |
          set -x
          # The announce step sets this, but announce itself is a candidate
          # for failure -- never depend on a previous step having run.
          git config --global user.email "vox3-ci@users.noreply.github.com"
          git config --global user.name  "vox3-ci"
          mkdir -p .failed
          {
            echo "FAILED at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "commit: $(git rev-parse HEAD 2>/dev/null || echo ?)"
            echo "--- tail of build_vox3.log ---"
            tail -60 build_vox3.log 2>/dev/null || echo "(no build_vox3.log)"
          } > .failed/failure.txt
          cd .failed
          git init --quiet .
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --quiet --orphan vox3-log
          git add -A
          git commit -q -m "vox3 build FAILED: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" || true
          git push --force origin vox3-log 2>&1 || echo "WARN: failure marker push failed"
