name: Build AI-VOX3 OpenVela firmware

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout team repo
        uses: actions/checkout@v4
        with:
          path: team_repo
          fetch-depth: 1

      - name: Install build deps + repo tool (fail loud)
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl wget xz-utils unzip build-essential \
            cmake ninja-build python3 python3-pip python3-dev rsync \
            libc++abi-dev flex bison gperf libncurses-dev libssl-dev libffi-dev \
            libusb-1.0-0-dev pkg-config device-tree-compiler u-boot-tools python-is-python3
          git lfs install
          sudo curl -fSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          test -s /usr/local/bin/repo || { echo "repo 下载失败"; exit 1; }
          repo --version
          # ESPTOOL (run#36..#38 forensics): three stacked problems.
          #  a) the runner PRE-INSTALLS esptool 4.7.0, so the old bare
          #     `pip install esptool` was a successful no-op (run#35 built
          #     with 4.7.0 and died at MKIMAGE);
          #  b) system site-packages is not writable -> pip defaults to
          #     --user installs (fine: ~/.local precedes system site);
          #  c) the stock pip 22.x CANNOT build new esptool sdists -- the
          #     generated metadata carries project name 'unknown', so every
          #     candidate >= 4.8.0 gets discarded ('inconsistent name'), and
          #     pip 22.x does not even know --break-system-packages.
          # Fix: upgrade pip FIRST (its own wheel is unaffected by c),
          # then install esptool 4.8.1 -- satisfies the MKIMAGE gate
          # (>= 4.8.0) with 4.x-era CLI behavior.
          { python3 -m pip install --user --upgrade pip \
              || python3 -m pip install --upgrade pip; } > pip_esptool.log 2>&1 || true
          { python3 -m pip install --user --upgrade "esptool==4.8.1" \
              || python3 -m pip install --upgrade "esptool==4.8.1"; } >> pip_esptool.log 2>&1 \
            || { echo "== ESPTOOL INSTALL FAILED, transcript: =="; cat pip_esptool.log; exit 1; }
          { echo "== esptool as the build will see it: ==";
            python3 -m esptool version || true;
            python3 -c "import esptool; print('module:', esptool.__file__, esptool.__version__)" || true;
            which esptool.py || true; } 2>&1
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela Contest CI"
          git config --global http.postBuffer 524288000

      - name: Install xtensa-esp32s3-elf toolchain 12.2.0 (single-dash names, matches Make.defs)
        id: toolchain
        run: |
          wget -c "https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" -O /tmp/xt.tar.gz
          sudo tar -xf /tmp/xt.tar.gz -C /opt
          echo "/opt/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
          xtensa-esp32s3-elf-gcc --version | head -n1

      - name: repo init + sync (official full manifest, fail loud)
        id: sync
        run: |
          mkdir -p openvela
          cd openvela
          { which repo; repo --version; } > init.log 2>&1 || echo "!! repo 检查失败" >> init.log
          repo init -u https://github.com/open-vela/manifests.git \
            -b dev-ai-contest-2026 -m openvela.xml --git-lfs >> init.log 2>&1 \
            || { echo "== INIT FAILED ==" >> init.log; exit 1; }
          echo "INIT OK" >> init.log
          (repo sync -c -j4 --no-tags) >> sync.log 2>&1 \
            || { echo "== SYNC FAILED ==" >> sync.log; exit 1; }
          echo "SYNC OK" >> sync.log
          echo "=== 自检 ===" >> sync.log
          ls -la build.sh >> sync.log 2>&1 || true

      - name: Install AI-VOX3 BSP + app (validated staging layout, Make flow)
        id: bsp
        run: |
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/ai_vox3 openvela/vendor/espressif/boards/esp32s3/ai_vox3
          cp -r team_repo/staging/apps/examples/desktop_companion openvela/apps/examples/desktop_companion
          # Register the app Kconfig with an ABSOLUTE source path — mirrors mkkconfig.sh
          # output exactly ("source \"<abs path>\": relative paths fail because $srctree
          # is unset when olddefconfig parses the apps tree (run#19 root cause).
          mkdir -p openvela/apps/examples
          grep -q 'desktop_companion' openvela/apps/examples/Kconfig 2>/dev/null \
            || echo "source \"${{ github.workspace }}/openvela/apps/examples/desktop_companion/Kconfig\"" >> openvela/apps/examples/Kconfig
          # Build registration ships as staging .../desktop_companion/Make.defs (official
          # per-example pattern; auto-included by apps/examples/Make.defs wildcard).
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/common openvela/vendor/espressif/boards/esp32s3/common
          # Vendor board-common must be REAL, not a stub (run#25/#26 root cause):
          # tools/Config.mk assigns BOARD_COMMON_DIR = $(BOARD_DIR)/../common whenever
          # that directory EXISTS (its else-branch has no CONFIG_ARCH_BOARD_COMMON
          # check), and scripts/Make.defs (ARCHSCRIPT) plus tools/Unix.mk (board
          # symlink) both dereference it.  With only the stub common/configs from
          # run#18, both dereferences hit an empty shell -> "No rule to make target"
          # for esp32s3_peripherals.ld AND libboard.a.  The .ld scripts are copied
          # from the in-tree nuttx so they always match the nuttx being built.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/scripts
          # Copy EVERY .ld: flat_memory.ld #includes esp32s3_aliases.ld which
          # pulls further scripts -- copying only 4 named files broke the
          # include chain (run#28: "esp32s3_aliases.ld: No such file").
          cp openvela/nuttx/boards/xtensa/esp32s3/common/scripts/*.ld \
             openvela/vendor/espressif/boards/esp32s3/common/scripts/ \
             || { echo "== LDSCRIPT COPY FAILED =="; exit 1; }
          ls -la openvela/vendor/espressif/boards/esp32s3/common/scripts
          # Keep the configs stub that configure's process_config.sh references.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/configs
          echo "BSP+应用已就位"
          echo "--- apps/examples/Kconfig ---"
          cat openvela/apps/examples/Kconfig

      - name: Build AI-VOX3 openvela config (official m() Makefile chain via VELA_USE_MAKEFILE=1)
        id: build
        working-directory: openvela
        run: |
          CFG="vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela"
          pip3 install --quiet kconfiglib || pip install --quiet kconfiglib || true
          { echo "PWD=$PWD"; ls -d nuttx apps build vendor/espressif/boards/esp32s3/ai_vox3 2>&1; } > build.log 2>&1 || true
          source build/envsetup.sh >> build.log 2>&1 || { echo "== ENSETUP FAILED ==" >> build.log; exit 1; }
          echo "ENSETUP OK" >> build.log
          lunch "$CFG" >> build.log 2>&1 || { echo "== LUNCH FAILED ==" >> build.log; exit 1; }
          echo "LUNCH OK" >> build.log
          # ------------------------------------------------------------------
          # AUDIT GATE FIX (run#32): with the Makefile chain `lunch` only
          # records the selection -- nuttx/.config is created later by
          # _do_makefile_build INSIDE `m` (open-vela/build envsetup.sh,
          # verbatim: "if [ ! -r $T/nuttx/.config ]; then
          #   ${TOOLSDIR}/configure.sh -e $T/nuttx/${BOARD_CONFIG}; fi",
          # BOARD_CONFIG = ../vendor/<v>/boards/<b>/configs/<c>), so the
          # audit below silently no-opped ("WARN: .config not found after
          # lunch; audit skipped" -- run#32 log line 15) and the NOINLINE
          # check never ran.  Pre-generate .config here with the EXACT same
          # command; `m` then sees an existing .config ([ ! -r ] fails) and
          # skips its own configure, so this .config IS the one the build
          # consumes, and the audit finally runs BEFORE the 40-min compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            nuttx/tools/configure.sh -e "$PWD/nuttx/../vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela" >> build.log 2>&1 \
              || { echo "== PRE-CONFIGURE FAILED ==" >> build.log; exit 1; }
            echo "PRE-CONFIGURE OK (.config materialized before audit)" >> build.log
          fi
          # ------------------------------------------------------------------
          # CONFIG AUDIT: olddefconfig silently drops defconfig lines whose
          # Kconfig deps are unmet (run#29 root cause: AUDIO_ES8311 lives
          # behind the unset DRIVERS_AUDIO umbrella -> es8311.h compiled
          # empty). Fail loud HERE instead of 40 minutes into the compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            echo "== AUDIT GATE FAILED: .config still missing after pre-configure ==" >> build.log
            exit 1
          fi
          echo "== CONFIG AUDIT ==" >> build.log
          grep -E '^CONFIG_(AUDIO|DRIVERS_AUDIO|I2C|I2S|ES8311|LCD_ST7789|ESP32S3_SPI2|ESP32S3_APP_FORMAT|ESPRESSIF)' nuttx/.config >> build.log || true
          # Diagnostics for the run#32 link fixes (A: task_tls, B: nxmutex):
          grep -E 'NOINLINE|TLS_TASK_NELEM' nuttx/.config >> build.log || true
          for sym in CONFIG_AUDIO=y CONFIG_DRIVERS_AUDIO=y CONFIG_AUDIO_ES8311=y CONFIG_AUDIO_I2S=y CONFIG_I2C=y CONFIG_I2S=y CONFIG_ESP32S3_I2C0=y CONFIG_ESP32S3_I2C0_MASTER_MODE=y CONFIG_ESPRESSIF_I2C_PERIPH_MASTER_MODE=y CONFIG_ESP32S3_I2S=y CONFIG_ESP32S3_SPI2=y CONFIG_LCD_ST7789=y CONFIG_AI_VOX3_SERVO=y CONFIG_AI_VOX3_BUTTONS=y CONFIG_ESP32S3_LEDC=y CONFIG_ESP32S3_LEDC_TIM0=y CONFIG_ESP32S3_LEDC_TIM0_CHANNELS=1 CONFIG_ESP32S3_LEDC_CHANNEL0_PIN=42 CONFIG_ESP32S3_LEDC_CHANNEL1_PIN=43 CONFIG_ESP32S3_LEDC_CHANNEL2_PIN=44 CONFIG_ESP32S3_LEDC_CHANNEL3_PIN=48 CONFIG_ESP32S3_GPIO_IRQ=y CONFIG_TLS_TASK_NELEM=8 CONFIG_ESP32S3_USBSERIAL=y CONFIG_ESP32S3_SPIRAM=y CONFIG_ESP32S3_SPIRAM_MODE_OCT=y CONFIG_ESP32S3_SPIRAM_BOOT_INIT=y CONFIG_ESP32S3_SPIRAM_COMMON_HEAP=y CONFIG_LV_COLOR_DEPTH=16 CONFIG_LV_USE_CLIB_MALLOC=y CONFIG_INIT_ENTRYPOINT='"desktop_companion_main"'; do
            grep -qx "$sym" nuttx/.config || { echo "== CONFIG AUDIT FAILED: $sym not in .config ==" >> build.log; exit 1; }
          done
          # SIMPLE_BOOT gate: the board must boot straight from the ROM with no
          # 2nd-stage IDF bootloader.  If APP_FORMAT_LEGACY (or MCUBOOT) is ever
          # selected, ESPRESSIF_SIMPLE_BOOT is silently disabled by its
          # depends-on and we end up on an IDF bootloader whose chip-revision
          # check rejects this ESP32-S3 (revision v0.2) -- symptom: dark LCD,
          # zero bytes on the USB-Serial/JTAG console.
          if grep -qE '^CONFIG_ESP32S3_APP_FORMAT_(LEGACY|MCUBOOT)=y' nuttx/.config; then
            echo "== CONFIG AUDIT FAILED: an APP_FORMAT is selected -> SIMPLE_BOOT is off ==" >> build.log
            grep -E 'APP_FORMAT|SIMPLE_BOOT' nuttx/.config >> build.log || true
            exit 1
          fi
          if ! grep -qE '^CONFIG_ESPRESSIF_SIMPLE_BOOT=y' nuttx/.config; then
            echo "== CONFIG AUDIT FAILED: ESSPRESSIF_SIMPLE_BOOT is not y (direct boot expected) ==" >> build.log
            grep -E 'SIMPLE_BOOT|APP_FORMAT' nuttx/.config >> build.log || true
            exit 1
          fi
          { echo "== SPIRAM / LVGL audit probes =="
            grep -n 'SPIRAM' nuttx/.config || echo "  (no SPIRAM symbol in .config at all)"
            # NOTE: probe LV_* (the real LVGL symbols), NOT LVGL_* -- the
            # latter prefix does not exist in LVGL's Kconfig, so an LVGL_*
            # grep matches nothing and tells us nothing.  See the LVGL block
            # in the board defconfig for the full story.
            grep -nE 'LV_COLOR_DEPTH|LV_USE_(CLIB|BUILTIN)_MALLOC|LV_USE_DEMO_WIDGETS' nuttx/.config \
              || echo "  (no LV_* symbol in .config at all)"; } >> build.log
          # nxmutex link fix (run#31): the mutex impl must stay inline.
          grep -qx '# CONFIG_LIBC_SEM_MUTEX_NOINLINE is not set' nuttx/.config || { echo "== CONFIG AUDIT FAILED: CONFIG_LIBC_SEM_MUTEX_NOINLINE must be off ==" >> build.log; exit 1; }
          echo "CONFIG AUDIT OK" >> build.log
          # ------------------------------------------------------------------
          # Pre-seed esp-hal-3rdparty at the pinned commit and fix its lock
          # initializer BEFORE the build's own clone step (run#23/#24):
          # OpenVela's nuttx defines spinlock_t as a STRUCT unconditionally
          # (include/nuttx/spinlock_type.h, all three branches), but
          # espressif/esp-hal-3rdparty@9fc713a initializes it with scalar 0
          # (components/esp_hw_support/clk_ctrl_os.c:39
          #   "static lock_type_t periph_spinlock = LOCK_INITIALIZER_UNLOCKED"
          #  with LOCK_INITIALIZER_UNLOCKED hard-coded to 0 under __NuttX__)
          # -> "error: invalid initializer" regardless of CONFIG_SMP.
          # The build's context target skips its clone when the directory
          # already exists, so we clone the pinned commit, rewrite the
          # initializer to SP_UNLOCKED (defined by all spinlock_type.h
          # branches), and let the normal build proceed on top.
          # ------------------------------------------------------------------
          {
            mkdir -p nuttx/arch/xtensa/src/esp32s3
            if [ ! -e nuttx/arch/xtensa/src/chip ]; then ln -s esp32s3 nuttx/arch/xtensa/src/chip; fi
            HALDIR="nuttx/arch/xtensa/src/esp32s3/esp-hal-3rdparty"
            if [ ! -d "$HALDIR" ]; then
              rm -rf "$HALDIR"
              git init -q "$HALDIR"
              git -C "$HALDIR" remote add origin https://github.com/espressif/esp-hal-3rdparty.git
              git -C "$HALDIR" fetch -q --depth 1 origin 9fc713a95b1ff150dd0b0647e465d3c624056bb1 \
                || { rm -rf "$HALDIR"; git clone -q https://github.com/espressif/esp-hal-3rdparty.git "$HALDIR"; }
              git -C "$HALDIR" checkout -q FETCH_HEAD 2>/dev/null || git -C "$HALDIR" checkout -q 9fc713a95b1ff150dd0b0647e465d3c624056bb1
            fi
            grep -rl "LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components" | xargs -r sed -i \
              's/^#define LOCK_INITIALIZER_UNLOCKED[[:space:]]*0[[:space:]]*$/#define LOCK_INITIALIZER_UNLOCKED SP_UNLOCKED/'
            echo "== esp-hal-3rdparty pre-seeded, lock-init patched: =="
            # `|| true`: this is a DIAGNOSTIC.  grep exits 1 when the pattern
            # is absent, and under GitHub's `bash -e` that would abort the step
            # -- turning a cosmetic log line into a hard build failure.  The
            # patch outcome is verified by the compile itself.
            grep -n "define LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components/esp_hw_support/clk_ctrl_os.c" || true
          } >> build.log 2>&1 || { echo "== HAL PRESEED FAILED ==" >> build.log; exit 1; }
          echo "HAL PRESEED OK" >> build.log
          # ------------------------------------------------------------------
          # ESPTOOL VERSION GATE (run#35): the build reached MKIMAGE
          # ("MKIMAGE: ESP32-S3 binary") and died with
          #   "Unsupported esptool version: 4.7.0 expects >= 4.8.0"
          # even though the deps step installed esptool — something inside
          # the provisioning chain pins or shadows it.  Install at the last
          # moment before `m` so nothing can downgrade it in between, and
          # record the exact version the build will see.
          # run#42 addendum: ">= 4.8.0" resolved to esptool 5.4.0 once the
          # deps step had upgraded pip.  MKIMAGE survived 5.x, but esptool 5
          # renamed commands (merge_bin -> merge-bin) and the Collect-step
          # merge uses the 4.x spelling -- pin ==4.8.1 exactly.
          # ------------------------------------------------------------------
          {
            python3 -m pip install --quiet --upgrade "esptool==4.8.1" \
              || pip install --quiet --upgrade "esptool==4.8.1" \
              || { echo "== ESPTOOL INSTALL FAILED =="; exit 1; }
            echo "== esptool version seen by the build: =="
            python3 -m esptool version || esptool.py version || true
            which esptool.py || true
          } >> build.log 2>&1 || { echo "== ESPTOOL PREP FAILED ==" >> build.log; exit 1; }
          echo "ESPTOOL OK" >> build.log
          export VELA_USE_MAKEFILE=1
          # Override the envsetup default (which appends -Werror): the official
          # esp32s3 chip layer (esp32s3_libc_stubs.c 'noreturn' warning) does not
          # compile cleanly under -Werror with this toolchain (run#22). The
          # Makefile path passes EXTRAFLAGS on every make call, so this export
          # fully replaces the default.
          export VELA_EXTRA_FLAGS="-Wno-cpp -Wno-deprecated-declarations"
          echo "VELA_USE_MAKEFILE=1 (force _do_makefile_build)" >> build.log
          echo "VELA_EXTRA_FLAGS=$VELA_EXTRA_FLAGS (no -Werror)" >> build.log
          # ------------------------------------------------------------------
          # run#54/#55 post-mortem.  run#54 built fine but was reported as a
          # failed step; that was the `ls ... 2>/dev/null` diagnostic tripping
          # `bash -e` (2>/dev/null silences output, NOT the exit code).
          # run#55 added `|| true` to that line -- the `ls` output duly
          # appeared in build.log -- yet the step STILL reported failure, and
          # neither the "BUILD OK" nor the "BUILD FAILED" verdict line was
          # written.  So the step is being killed by `-e` somewhere we cannot
          # see, and no amount of per-line guarding has proven reliable.
          #
          # Stop fighting the shell.  The whole build+verdict sequence now runs
          # inside an explicit subshell with `set +e`, and it communicates its
          # result OUT-OF-BAND through a marker file instead of through its
          # exit status.  `run:` can then always end 0, and the separate
          # "Decide build outcome" step below turns the marker into the real
          # pass/fail signal.  Nothing about the build can be lost to a
          # shell-option interaction again.
          # ------------------------------------------------------------------
          (
            set +e
            set -o pipefail
            rc=127
            m -j"$(nproc)" 2>&1 | tee -a build.log
            rc=$?
            echo "M-CHAIN rc=$rc" >> build.log
            ls -la nuttx/nuttx nuttx/nuttx.bin >> build.log 2>&1
            echo "$rc" > build_rc.txt
          ) >> build.log 2>&1
          # This step always "succeeds" -- see the verdict step below.
          exit 0

      - name: Decide build outcome
        id: verdict
        working-directory: openvela
        run: |
          # Reads the marker the build step wrote, then re-checks the artifact
          # independently.  This is the ONLY place the build's pass/fail is
          # decided, so a shell quirk in the build step cannot mark a good
          # build as failed (or a bad one as good).
          rc="$(cat build_rc.txt 2>/dev/null || echo MISSING)"
          echo "build_rc.txt says: $rc" >> build.log
          if [ "$rc" = "MISSING" ]; then
            echo "== BUILD FAILED: build step did not write build_rc.txt ==" >> build.log
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "== BUILD FAILED: m chain exited $rc ==" >> build.log
            exit 1
          fi
          if [ ! -s nuttx/nuttx.bin ]; then
            echo "== BUILD FAILED: m exited 0 but nuttx/nuttx.bin is missing/empty ==" >> build.log
            exit 1
          fi
          # Verify it really is an ESP32-S3 image: first byte 0xE9 is
          # esp_image_header_t.magic.  Use `od` output captured to a variable
          # rather than a pipeline inside `[ ]`, which is fragile under -e.
          first_byte="$(od -An -tx1 -N1 nuttx/nuttx.bin | tr -d ' \n')"
          if [ "$first_byte" != "e9" ]; then
            echo "== BUILD FAILED: nuttx.bin first byte is '$first_byte', expected 'e9' ==" >> build.log
            exit 1
          fi
          size="$(stat -c%s nuttx/nuttx.bin)"
          echo "BUILD OK: nuttx/nuttx.bin present (${size} bytes, magic 0xE9, m rc=$rc)" >> build.log
          ls -la nuttx/nuttx nuttx/nuttx.bin >> build.log 2>&1

      - name: Collect firmware
        if: always()
        working-directory: openvela
        run: |
          mkdir -p firmware
          # SIMPLE_BOOT build: NuttX is loaded straight from the ROM, so the
          # ONLY artifact is nuttx.bin and it is flashed at offset 0x0.
          # There is no 2nd-stage bootloader and no generated partition table,
          # so there is nothing to merge -- an earlier revision of this step
          # shelled out to `esptool merge_bin` for a bootloader + partition
          # table + app trio, which no longer exists.
          find nuttx -name '*.bin' -exec ls -la {} \; > binlist.txt 2>&1 || true
          tail -c 3000 binlist.txt || true
          find nuttx -name 'nuttx.bin' -exec cp -v {} firmware/ \; 2>/dev/null || true
          cp -v binlist.txt firmware/ 2>/dev/null || true
          # The Publish step runs only on success and the logs branch only on
          # failure, so ship the build.log tail WITH the firmware itself
          # (Collect runs `if: always()`).
          tail -c 3000000 build.log > firmware/build_tail.log 2>/dev/null || true
          # Prove which boot path this image was built for.  ESSPRESSIF_
          # SIMPLE_BOOT=y (and no APP_FORMAT_*) means ROM direct boot, which is
          # what makes offset 0x0 correct.  If this block ever shows an
          # APP_FORMAT, the flashing offset changes -- do not ignore it.
          { echo ""
            echo "== BOOT FORMAT IN .config (nuttx.bin must be flashed at 0x0) =="
            grep -E 'APP_FORMAT|SIMPLE_BOOT|PARTITION_TABLE_OFFSET|KERNEL_OFFSET' nuttx/.config \
              || echo "  (no boot-format symbols found)"
            echo ""
            echo "== nuttx.bin =="
            ls -la nuttx/nuttx.bin 2>/dev/null || echo "  MISSING"
          } >> firmware/build_tail.log
          ls -la firmware || true

      - name: Publish firmware to firmware branch (SSH-pullable)
        # Gated on the ARTIFACT, not on step status.  run#54 taught us that a
        # successful build can still be reported as a failed step, and an
        # `if: success()` gate then strands a perfectly good nuttx.bin on the
        # runner forever.  Collect already ran (if: always()) and staged the
        # binary into openvela/firmware/, so publish whenever it is there.
        #
        # Publish whenever the verdict step PASSED and Collect staged the
        # binary.  `if: always()` is required because a failure in an earlier
        # step would otherwise skip this one even when the artifact is good --
        # but the verdict outcome is checked explicitly so we never ship an
        # image the verdict refused.  The 0xE9 magic is re-checked here too:
        # two independent gates, neither trusting a step's status alone.
        if: always()
        run: |
          if [ "${{ steps.verdict.outcome }}" != "success" ]; then
            echo "verdict was '${{ steps.verdict.outcome }}' -- refusing to publish"
            exit 0
          fi
          FW="${{ github.workspace }}/openvela/firmware/nuttx.bin"
          if ! ls "$FW" >/dev/null 2>&1; then
            echo "no nuttx.bin staged by Collect -- nothing to publish"
            exit 0
          fi
          magic=$(od -An -tx1 -N1 "$FW" | tr -d ' \n')
          if [ "$magic" != "e9" ]; then
            echo "staged nuttx.bin has magic '$magic', not 'e9' -- refusing to publish"
            exit 0
          fi
          echo "publishing nuttx.bin ($(stat -c%s "$FW") bytes, magic 0xE9); verdict was '${{ steps.verdict.outcome }}'"
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/fw && cd /tmp/fw
          git init -q -b firmware .
          cp "${{ github.workspace }}/openvela/firmware/"* .
          git add -A
          git commit -q -m "firmware build run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin firmware --force
          echo "固件已推送到 firmware 分支"

      - name: Publish build log to logs branch on failure
        if: failure()
        run: |
          # Step-level forensics (run#36 died with zero logs: which step?):
          echo "=== STEP OUTCOMES ===" | tee step_outcomes.txt
          echo "deps: ${{ steps.deps.outcome }}" | tee -a step_outcomes.txt
          echo "toolchain: ${{ steps.toolchain.outcome }}" | tee -a step_outcomes.txt
          echo "sync: ${{ steps.sync.outcome }}" | tee -a step_outcomes.txt
          echo "bsp: ${{ steps.bsp.outcome }}" | tee -a step_outcomes.txt
          echo "build: ${{ steps.build.outcome }} (always success by design; see verdict)" | tee -a step_outcomes.txt
          echo "verdict: ${{ steps.verdict.outcome }}" | tee -a step_outcomes.txt
          tail -c 2000000 openvela/build.log > build_tail.log 2>/dev/null || echo "no build.log" > build_tail.log
          tail -c 2000000 openvela/sync.log > sync_tail.log 2>/dev/null || echo "no sync.log" > sync_tail.log
          tail -c 2000000 openvela/init.log > init_tail.log 2>/dev/null || echo "no init.log" > init_tail.log
          ls -la openvela > dirlist.txt 2>&1 || true
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b logs .
          cp "${{ github.workspace }}/step_outcomes.txt" .
          cp "${{ github.workspace }}/pip_esptool.log" . 2>/dev/null || true
          # run#48: the Collect step is not tracked by step_outcomes.txt
          # and its merge transcript used to be lost on failure -- ship it.
          cp "${{ github.workspace }}/openvela/collect.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/build_tail.log" .
          cp "${{ github.workspace }}/sync_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/init_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/dirlist.txt" . 2>/dev/null || true
          # run#54: a successful build whose step was mis-reported as failed
          # left the binary stranded.  Collect staged it into
          # openvela/firmware/ -- ship it here too, so the logs branch is
          # always a complete record (binary + log) no matter which publish
          # path fires.
          cp "${{ github.workspace }}/openvela/firmware/nuttx.bin" . 2>/dev/null || true
          ls -la nuttx.bin 2>/dev/null || echo "  (no nuttx.bin in logs branch)"
          git add -A
          git commit -q -m "build log run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin logs --force
          echo "日志已推送到 logs 分支"
