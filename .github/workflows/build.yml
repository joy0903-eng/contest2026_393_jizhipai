name: Build AI-VOX3 OpenVela firmware

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout team repo
        uses: actions/checkout@v4
        with:
          path: team_repo
          fetch-depth: 1

      - name: Install build deps + repo tool (fail loud)
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl wget xz-utils unzip build-essential \
            cmake ninja-build python3 python3-pip python3-dev rsync \
            libc++abi-dev flex bison gperf libncurses-dev libssl-dev libffi-dev \
            libusb-1.0-0-dev pkg-config device-tree-compiler u-boot-tools python-is-python3
          git lfs install
          sudo curl -fSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          test -s /usr/local/bin/repo || { echo "repo 下载失败"; exit 1; }
          repo --version
          pip install --quiet esptool
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela Contest CI"
          git config --global http.postBuffer 524288000

      - name: Install xtensa-esp32s3-elf toolchain 12.2.0 (single-dash names, matches Make.defs)
        run: |
          wget -c "https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" -O /tmp/xt.tar.gz
          sudo tar -xf /tmp/xt.tar.gz -C /opt
          echo "/opt/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
          xtensa-esp32s3-elf-gcc --version | head -n1

      - name: repo init + sync (official full manifest, fail loud)
        run: |
          mkdir -p openvela
          cd openvela
          { which repo; repo --version; } > init.log 2>&1 || echo "!! repo 检查失败" >> init.log
          repo init -u https://github.com/open-vela/manifests.git \
            -b dev-ai-contest-2026 -m openvela.xml --git-lfs >> init.log 2>&1 \
            || { echo "== INIT FAILED ==" >> init.log; exit 1; }
          echo "INIT OK" >> init.log
          (repo sync -c -j4 --no-tags) >> sync.log 2>&1 \
            || { echo "== SYNC FAILED ==" >> sync.log; exit 1; }
          echo "SYNC OK" >> sync.log
          echo "=== 自检 ===" >> sync.log
          ls -la build.sh >> sync.log 2>&1 || true

      - name: Install AI-VOX3 BSP + app (validated staging layout, Make flow)
        run: |
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/ai_vox3 openvela/vendor/espressif/boards/esp32s3/ai_vox3
          cp -r team_repo/staging/apps/examples/desktop_companion openvela/apps/examples/desktop_companion
          grep -q 'examples/desktop_companion/Kconfig' openvela/apps/examples/Kconfig \
            || echo 'source "examples/desktop_companion/Kconfig"' >> openvela/apps/examples/Kconfig
          grep -q 'CONFIG_EXAMPLES_DESKTOP_COMPANION' openvela/apps/examples/Make.defs \
            || printf '\nifeq ($(CONFIG_EXAMPLES_DESKTOP_COMPANION),y)\n  CONFIGURED_APPS += $(APPDIR)/examples/desktop_companion\nendif\n' >> openvela/apps/examples/Make.defs
          echo "BSP+应用已就位"

      - name: Build AI-VOX3 openvela config (cmake, fallback to make flow)
        working-directory: openvela
        run: |
          set -o pipefail
          BUILD_SH=$(find .. -maxdepth 2 -name build.sh | head -1)
          [ -n "$BUILD_SH" ] || { echo "ERROR: build.sh 未找到"; exit 1; }
          CFG="vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela/"
          if ! "$BUILD_SH" "$CFG" --cmake -j"$(nproc)" 2>&1 | tee build.log; then
            echo "!! --cmake 构建失败，回退传统构建"
            rm -rf cmake_out
            "$BUILD_SH" "$CFG" -j"$(nproc)" 2>&1 | tee -a build.log
          fi
          find . -maxdepth 3 -name 'nuttx*' -o -maxdepth 3 -name 'bootloader*' | head -10

      - name: Collect firmware (merge if needed)
        if: always()
        working-directory: openvela
        run: |
          mkdir -p firmware
          find nuttx -maxdepth 2 \( -name 'nuttx.bin' -o -name 'bootloader.bin' -o -name 'partition-table.bin' -o -name 'nuttx.merged.bin' \) -exec cp -v {} firmware/ \; 2>/dev/null || true
          if [ ! -f firmware/nuttx.merged.bin ] && [ -f firmware/bootloader.bin ] && [ -f firmware/partition-table.bin ] && [ -f firmware/nuttx.bin ]; then
            python3 -m esptool --chip esp32s3 merge_bin -o firmware/nuttx.merged.bin \
              --flash-mode dio --flash-freq keep --flash-size keep \
              0x0 firmware/bootloader.bin 0x8000 firmware/partition-table.bin 0x10000 firmware/nuttx.bin
          fi
          ls -la firmware || true

      - name: Publish firmware to firmware branch (SSH-pullable)
        if: success()
        run: |
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/fw && cd /tmp/fw
          git init -q -b firmware .
          cp "${{ github.workspace }}/openvela/firmware/"* .
          git add -A
          git commit -q -m "firmware build run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin firmware --force
          echo "固件已推送到 firmware 分支"

      - name: Publish build log to logs branch on failure
        if: failure()
        run: |
          tail -c 2000000 openvela/build.log > build_tail.log 2>/dev/null || echo "no build.log" > build_tail.log
          tail -c 2000000 openvela/sync.log > sync_tail.log 2>/dev/null || echo "no sync.log" > sync_tail.log
          tail -c 2000000 openvela/init.log > init_tail.log 2>/dev/null || echo "no init.log" > init_tail.log
          ls -la openvela > dirlist.txt 2>&1 || true
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b logs .
          cp "${{ github.workspace }}/build_tail.log" .
          cp "${{ github.workspace }}/sync_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/init_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/dirlist.txt" . 2>/dev/null || true
          git add -A
          git commit -q -m "build log run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin logs --force
          echo "日志已推送到 logs 分支"
