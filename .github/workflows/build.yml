name: Build AI-VOX3 OpenVela firmware

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout team repo
        uses: actions/checkout@v4
        with:
          path: team_repo
          fetch-depth: 1

      - name: Install build deps + repo tool (fail loud)
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl wget xz-utils unzip build-essential \
            cmake ninja-build python3 python3-pip python3-dev rsync \
            libc++abi-dev flex bison gperf libncurses-dev libssl-dev libffi-dev \
            libusb-1.0-0-dev pkg-config device-tree-compiler u-boot-tools python-is-python3
          git lfs install
          sudo curl -fSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          test -s /usr/local/bin/repo || { echo "repo 下载失败"; exit 1; }
          repo --version
          # ESPTOOL (run#36..#38 forensics): three stacked problems.
          #  a) the runner PRE-INSTALLS esptool 4.7.0, so the old bare
          #     `pip install esptool` was a successful no-op (run#35 built
          #     with 4.7.0 and died at MKIMAGE);
          #  b) system site-packages is not writable -> pip defaults to
          #     --user installs (fine: ~/.local precedes system site);
          #  c) the stock pip 22.x CANNOT build new esptool sdists -- the
          #     generated metadata carries project name 'unknown', so every
          #     candidate >= 4.8.0 gets discarded ('inconsistent name'), and
          #     pip 22.x does not even know --break-system-packages.
          # Fix: upgrade pip FIRST (its own wheel is unaffected by c),
          # then install esptool 4.8.1 -- satisfies the MKIMAGE gate
          # (>= 4.8.0) with 4.x-era CLI behavior.
          { python3 -m pip install --user --upgrade pip \
              || python3 -m pip install --upgrade pip; } > pip_esptool.log 2>&1 || true
          { python3 -m pip install --user --upgrade "esptool==4.8.1" \
              || python3 -m pip install --upgrade "esptool==4.8.1"; } >> pip_esptool.log 2>&1 \
            || { echo "== ESPTOOL INSTALL FAILED, transcript: =="; cat pip_esptool.log; exit 1; }
          { echo "== esptool as the build will see it: ==";
            python3 -m esptool version || true;
            python3 -c "import esptool; print('module:', esptool.__file__, esptool.__version__)" || true;
            which esptool.py || true; } 2>&1
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela Contest CI"
          git config --global http.postBuffer 524288000

      - name: Install xtensa-esp32s3-elf toolchain 12.2.0 (single-dash names, matches Make.defs)
        id: toolchain
        run: |
          wget -c "https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" -O /tmp/xt.tar.gz
          sudo tar -xf /tmp/xt.tar.gz -C /opt
          echo "/opt/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
          xtensa-esp32s3-elf-gcc --version | head -n1

      - name: repo init + sync (official full manifest, fail loud)
        id: sync
        run: |
          mkdir -p openvela
          cd openvela
          { which repo; repo --version; } > init.log 2>&1 || echo "!! repo 检查失败" >> init.log
          repo init -u https://github.com/open-vela/manifests.git \
            -b dev-ai-contest-2026 -m openvela.xml --git-lfs >> init.log 2>&1 \
            || { echo "== INIT FAILED ==" >> init.log; exit 1; }
          echo "INIT OK" >> init.log
          (repo sync -c -j4 --no-tags) >> sync.log 2>&1 \
            || { echo "== SYNC FAILED ==" >> sync.log; exit 1; }
          echo "SYNC OK" >> sync.log
          echo "=== 自检 ===" >> sync.log
          ls -la build.sh >> sync.log 2>&1 || true

      - name: Install AI-VOX3 BSP + app (validated staging layout, Make flow)
        id: bsp
        run: |
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/ai_vox3 openvela/vendor/espressif/boards/esp32s3/ai_vox3
          cp -r team_repo/staging/apps/examples/desktop_companion openvela/apps/examples/desktop_companion
          # Register the app Kconfig with an ABSOLUTE source path — mirrors mkkconfig.sh
          # output exactly ("source \"<abs path>\": relative paths fail because $srctree
          # is unset when olddefconfig parses the apps tree (run#19 root cause).
          mkdir -p openvela/apps/examples
          grep -q 'desktop_companion' openvela/apps/examples/Kconfig 2>/dev/null \
            || echo "source \"${{ github.workspace }}/openvela/apps/examples/desktop_companion/Kconfig\"" >> openvela/apps/examples/Kconfig
          # Build registration ships as staging .../desktop_companion/Make.defs (official
          # per-example pattern; auto-included by apps/examples/Make.defs wildcard).
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/common openvela/vendor/espressif/boards/esp32s3/common
          # Vendor board-common must be REAL, not a stub (run#25/#26 root cause):
          # tools/Config.mk assigns BOARD_COMMON_DIR = $(BOARD_DIR)/../common whenever
          # that directory EXISTS (its else-branch has no CONFIG_ARCH_BOARD_COMMON
          # check), and scripts/Make.defs (ARCHSCRIPT) plus tools/Unix.mk (board
          # symlink) both dereference it.  With only the stub common/configs from
          # run#18, both dereferences hit an empty shell -> "No rule to make target"
          # for esp32s3_peripherals.ld AND libboard.a.  The .ld scripts are copied
          # from the in-tree nuttx so they always match the nuttx being built.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/scripts
          # Copy EVERY .ld: flat_memory.ld #includes esp32s3_aliases.ld which
          # pulls further scripts -- copying only 4 named files broke the
          # include chain (run#28: "esp32s3_aliases.ld: No such file").
          cp openvela/nuttx/boards/xtensa/esp32s3/common/scripts/*.ld \
             openvela/vendor/espressif/boards/esp32s3/common/scripts/ \
             || { echo "== LDSCRIPT COPY FAILED =="; exit 1; }
          ls -la openvela/vendor/espressif/boards/esp32s3/common/scripts
          # Keep the configs stub that configure's process_config.sh references.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/configs
          echo "BSP+应用已就位"
          echo "--- apps/examples/Kconfig ---"
          cat openvela/apps/examples/Kconfig

      - name: Build AI-VOX3 openvela config (official m() Makefile chain via VELA_USE_MAKEFILE=1)
        id: build
        working-directory: openvela
        run: |
          CFG="vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela"
          pip3 install --quiet kconfiglib || pip install --quiet kconfiglib || true
          { echo "PWD=$PWD"; ls -d nuttx apps build vendor/espressif/boards/esp32s3/ai_vox3 2>&1; } > build.log 2>&1 || true
          source build/envsetup.sh >> build.log 2>&1 || { echo "== ENSETUP FAILED ==" >> build.log; exit 1; }
          echo "ENSETUP OK" >> build.log
          lunch "$CFG" >> build.log 2>&1 || { echo "== LUNCH FAILED ==" >> build.log; exit 1; }
          echo "LUNCH OK" >> build.log
          # ------------------------------------------------------------------
          # AUDIT GATE FIX (run#32): with the Makefile chain `lunch` only
          # records the selection -- nuttx/.config is created later by
          # _do_makefile_build INSIDE `m` (open-vela/build envsetup.sh,
          # verbatim: "if [ ! -r $T/nuttx/.config ]; then
          #   ${TOOLSDIR}/configure.sh -e $T/nuttx/${BOARD_CONFIG}; fi",
          # BOARD_CONFIG = ../vendor/<v>/boards/<b>/configs/<c>), so the
          # audit below silently no-opped ("WARN: .config not found after
          # lunch; audit skipped" -- run#32 log line 15) and the NOINLINE
          # check never ran.  Pre-generate .config here with the EXACT same
          # command; `m` then sees an existing .config ([ ! -r ] fails) and
          # skips its own configure, so this .config IS the one the build
          # consumes, and the audit finally runs BEFORE the 40-min compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            nuttx/tools/configure.sh -e "$PWD/nuttx/../vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela" >> build.log 2>&1 \
              || { echo "== PRE-CONFIGURE FAILED ==" >> build.log; exit 1; }
            echo "PRE-CONFIGURE OK (.config materialized before audit)" >> build.log
          fi
          # ------------------------------------------------------------------
          # CONFIG AUDIT: olddefconfig silently drops defconfig lines whose
          # Kconfig deps are unmet (run#29 root cause: AUDIO_ES8311 lives
          # behind the unset DRIVERS_AUDIO umbrella -> es8311.h compiled
          # empty). Fail loud HERE instead of 40 minutes into the compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            echo "== AUDIT GATE FAILED: .config still missing after pre-configure ==" >> build.log
            exit 1
          fi
          echo "== CONFIG AUDIT ==" >> build.log
          grep -E '^CONFIG_(AUDIO|DRIVERS_AUDIO|I2C|I2S|ES8311|LCD_ST7789|ESP32S3_SPI2|ESP32S3_APP_FORMAT|ESPRESSIF)' nuttx/.config >> build.log || true
          # Diagnostics for the run#32 link fixes (A: task_tls, B: nxmutex):
          grep -E 'NOINLINE|TLS_TASK_NELEM' nuttx/.config >> build.log || true
          for sym in CONFIG_AUDIO=y CONFIG_DRIVERS_AUDIO=y CONFIG_AUDIO_ES8311=y CONFIG_AUDIO_I2S=y CONFIG_I2C=y CONFIG_I2S=y CONFIG_ESP32S3_I2C0=y CONFIG_ESP32S3_I2C0_MASTER_MODE=y CONFIG_ESPRESSIF_I2C_PERIPH_MASTER_MODE=y CONFIG_ESP32S3_I2S=y CONFIG_ESP32S3_SPI2=y CONFIG_LCD_ST7789=y CONFIG_AI_VOX3_SERVO=y CONFIG_AI_VOX3_BUTTONS=y CONFIG_ESP32S3_LEDC=y CONFIG_ESP32S3_LEDC_TIM0=y CONFIG_ESP32S3_LEDC_TIM0_CHANNELS=1 CONFIG_ESP32S3_LEDC_CHANNEL0_PIN=42 CONFIG_ESP32S3_LEDC_CHANNEL1_PIN=43 CONFIG_ESP32S3_LEDC_CHANNEL2_PIN=44 CONFIG_ESP32S3_LEDC_CHANNEL3_PIN=48 CONFIG_ESP32S3_GPIO_IRQ=y CONFIG_TLS_TASK_NELEM=8 CONFIG_ESP32S3_APP_FORMAT_LEGACY=y CONFIG_ESP32S3_USBSERIAL=y CONFIG_INIT_ENTRYPOINT='"desktop_companion_main"'; do
            grep -qx "$sym" nuttx/.config || { echo "== CONFIG AUDIT FAILED: $sym not in .config ==" >> build.log; exit 1; }
          done
          # run#52 BISECT NEGATIVE AUDIT: PSRAM must be OFF for this run.
          # (The three positive SPIRAM entries were removed from the list above
          # on purpose -- asserting them would now fail the build.)  If PSRAM
          # ever sneaks back in, the bisect result becomes uninterpretable.
          grep -qx '# CONFIG_ESP32S3_SPIRAM is not set' nuttx/.config || { echo "== CONFIG AUDIT FAILED: SPIRAM must be OFF for run#52 bisect ==" >> build.log; exit 1; }
          grep -qx '# CONFIG_LVGL_BUFFER_ALLOC_EXTERNAL is not set' nuttx/.config || { echo "== CONFIG AUDIT FAILED: LVGL_BUFFER_ALLOC_EXTERNAL must be OFF when SPIRAM is off ==" >> build.log; exit 1; }
          # nxmutex link fix (run#31): the mutex impl must stay inline.
          grep -qx '# CONFIG_LIBC_SEM_MUTEX_NOINLINE is not set' nuttx/.config || { echo "== CONFIG AUDIT FAILED: CONFIG_LIBC_SEM_MUTEX_NOINLINE must be off ==" >> build.log; exit 1; }
          echo "CONFIG AUDIT OK" >> build.log
          # ------------------------------------------------------------------
          # run#52: BOOTLOADER CONSOLE -> USB-Serial/JTAG  (diagnostic)
          # ------------------------------------------------------------------
          # Why: on this board the 2nd-stage IDF bootloader defaults to
          # CONFIG_ESP_CONSOLE_UART (UART0 = GPIO43/44).  The AI-VOX3 has no
          # USB-UART bridge on those pins -- only the native USB-Serial/JTAG
          # port (GPIO19/20) is exposed as COM4 -- so every bootloader message
          # has been invisible, which is exactly why a dead bootloader and a
          # dead NuttX look identical from the host (0 bytes on COM4).
          #
          # Mechanism (verified in the fork's arch/xtensa/src/esp32s3/
          # Bootloader.mk + espressif/esp-nuttx-bootloader build_idfboot.sh):
          #   * Bootloader.mk generates `bootloader.conf` from nuttx/.config;
          #     its LEGACY block writes ONLY the flash size/mode/freq and the
          #     partition-table settings -- no console line at all.
          #   * build_idfboot.sh passes `-f bootloader.conf` straight through
          #     as cmake's -DSDKCONFIG_DEFAULTS, so whatever is in that file
          #     wins over the bootloader repo's own sdkconfig.defaults.
          #   * Therefore appending $(call cfg_en,CONFIG_ESP_CONSOLE_USB_
          #     SERIAL_JTAG) to the LEGACY block makes the generated conf
          #     carry CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y (cfg_en emits
          #     "=<1|y>" in the MCUBOOT case and "=y" otherwise), and the
          #     bootloader logs land on COM4 where we can actually read them.
          #
          # Soft-fail by design: if the fork's Bootloader.mk ever changes
          # shape we want a NOISY SKIP, never a broken build.
          # ------------------------------------------------------------------
          python3 - <<'PYEOF' >> build.log 2>&1 || echo "BOOTLOADER CONSOLE PATCH STEP ERRORED (non-fatal)" >> build.log
          import pathlib, sys

          mk = pathlib.Path("nuttx/arch/xtensa/src/esp32s3/Bootloader.mk")
          anchor = (
              "\t\t$(call cfg_val,CONFIG_PARTITION_TABLE_OFFSET,"
              "$(CONFIG_ESP32S3_PARTITION_TABLE_OFFSET)) \\\n"
          )
          inject = "\t\t$(call cfg_en,CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG) \\\n"

          if not mk.is_file():
              print("BOOTLOADER CONSOLE PATCH SKIPPED: %s not found" % mk)
              sys.exit(0)

          text = mk.read_text()
          if "CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG" in text:
              print("BOOTLOADER CONSOLE PATCH SKIPPED: already present")
              sys.exit(0)

          if anchor not in text:
              print("BOOTLOADER CONSOLE PATCH SKIPPED: anchor not found")
              idx = text.find("PARTITION_TABLE_CUSTOM")
              print("--- Bootloader.mk context around PARTITION_TABLE ---")
              print(text[max(0, idx - 600): idx + 600] if idx >= 0 else text[-1200:])
              sys.exit(0)

          mk.write_text(text.replace(anchor, anchor + inject, 1))
          print("BOOTLOADER CONSOLE PATCH APPLIED")
          for n, line in enumerate(mk.read_text().splitlines(), 1):
              if "CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG" in line:
                  print("  patched line %d: %s" % (n, line.strip()))
          PYEOF
          echo "== bootloader console patch probe ==" >> build.log
          grep -n 'CONFIG_ESP_CONSOLE' nuttx/arch/xtensa/src/esp32s3/Bootloader.mk >> build.log || echo "  (no CONFIG_ESP_CONSOLE line in Bootloader.mk)" >> build.log
          # ------------------------------------------------------------------
          # Pre-seed esp-hal-3rdparty at the pinned commit and fix its lock
          # initializer BEFORE the build's own clone step (run#23/#24):
          # OpenVela's nuttx defines spinlock_t as a STRUCT unconditionally
          # (include/nuttx/spinlock_type.h, all three branches), but
          # espressif/esp-hal-3rdparty@9fc713a initializes it with scalar 0
          # (components/esp_hw_support/clk_ctrl_os.c:39
          #   "static lock_type_t periph_spinlock = LOCK_INITIALIZER_UNLOCKED"
          #  with LOCK_INITIALIZER_UNLOCKED hard-coded to 0 under __NuttX__)
          # -> "error: invalid initializer" regardless of CONFIG_SMP.
          # The build's context target skips its clone when the directory
          # already exists, so we clone the pinned commit, rewrite the
          # initializer to SP_UNLOCKED (defined by all spinlock_type.h
          # branches), and let the normal build proceed on top.
          # ------------------------------------------------------------------
          {
            mkdir -p nuttx/arch/xtensa/src/esp32s3
            if [ ! -e nuttx/arch/xtensa/src/chip ]; then ln -s esp32s3 nuttx/arch/xtensa/src/chip; fi
            HALDIR="nuttx/arch/xtensa/src/esp32s3/esp-hal-3rdparty"
            if [ ! -d "$HALDIR" ]; then
              rm -rf "$HALDIR"
              git init -q "$HALDIR"
              git -C "$HALDIR" remote add origin https://github.com/espressif/esp-hal-3rdparty.git
              git -C "$HALDIR" fetch -q --depth 1 origin 9fc713a95b1ff150dd0b0647e465d3c624056bb1 \
                || { rm -rf "$HALDIR"; git clone -q https://github.com/espressif/esp-hal-3rdparty.git "$HALDIR"; }
              git -C "$HALDIR" checkout -q FETCH_HEAD 2>/dev/null || git -C "$HALDIR" checkout -q 9fc713a95b1ff150dd0b0647e465d3c624056bb1
            fi
            grep -rl "LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components" | xargs -r sed -i \
              's/^#define LOCK_INITIALIZER_UNLOCKED[[:space:]]*0[[:space:]]*$/#define LOCK_INITIALIZER_UNLOCKED SP_UNLOCKED/'
            echo "== esp-hal-3rdparty pre-seeded, lock-init patched: =="
            grep -n "define LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components/esp_hw_support/clk_ctrl_os.c"
          } >> build.log 2>&1 || { echo "== HAL PRESEED FAILED ==" >> build.log; exit 1; }
          echo "HAL PRESEED OK" >> build.log
          # ------------------------------------------------------------------
          # ESPTOOL VERSION GATE (run#35): the build reached MKIMAGE
          # ("MKIMAGE: ESP32-S3 binary") and died with
          #   "Unsupported esptool version: 4.7.0 expects >= 4.8.0"
          # even though the deps step installed esptool — something inside
          # the provisioning chain pins or shadows it.  Install at the last
          # moment before `m` so nothing can downgrade it in between, and
          # record the exact version the build will see.
          # run#42 addendum: ">= 4.8.0" resolved to esptool 5.4.0 once the
          # deps step had upgraded pip.  MKIMAGE survived 5.x, but esptool 5
          # renamed commands (merge_bin -> merge-bin) and the Collect-step
          # merge uses the 4.x spelling -- pin ==4.8.1 exactly.
          # ------------------------------------------------------------------
          {
            python3 -m pip install --quiet --upgrade "esptool==4.8.1" \
              || pip install --quiet --upgrade "esptool==4.8.1" \
              || { echo "== ESPTOOL INSTALL FAILED =="; exit 1; }
            echo "== esptool version seen by the build: =="
            python3 -m esptool version || esptool.py version || true
            which esptool.py || true
          } >> build.log 2>&1 || { echo "== ESPTOOL PREP FAILED ==" >> build.log; exit 1; }
          echo "ESPTOOL OK" >> build.log
          export VELA_USE_MAKEFILE=1
          # Override the envsetup default (which appends -Werror): the official
          # esp32s3 chip layer (esp32s3_libc_stubs.c 'noreturn' warning) does not
          # compile cleanly under -Werror with this toolchain (run#22). The
          # Makefile path passes EXTRAFLAGS on every make call, so this export
          # fully replaces the default.
          export VELA_EXTRA_FLAGS="-Wno-cpp -Wno-deprecated-declarations"
          echo "VELA_USE_MAKEFILE=1 (force _do_makefile_build)" >> build.log
          echo "VELA_EXTRA_FLAGS=$VELA_EXTRA_FLAGS (no -Werror)" >> build.log
          set -o pipefail
          m -j"$(nproc)" 2>&1 | tee -a build.log
          rc=$?
          echo "M-CHAIN rc=$rc" >> build.log
          ls -la nuttx/nuttx nuttx/nuttx.bin 2>/dev/null || true
          # ------------------------------------------------------------------
          # BOOTLOADER + PARTITION TABLE (run#42, root cause nailed verbatim
          # from Bootloader.mk + Kconfig): the defconfig now pins
          # CONFIG_ESP32S3_APP_FORMAT_LEGACY=y.  Before that, the hidden
          # ESPRESSIF_SIMPLE_BOOT defaulted to y (LEGACY defaults to
          # `y if BUILD_PROTECTED`, and this is a flat build), so the
          # `bootloader` target was the empty-shell branch ("Using direct
          # bootloader to boot NuttX.") and produced NOTHING -- the
          # run#40/#41 binlist forensics.  The LEGACY branch clones
          # esp-nuttx-bootloader, runs build_idfboot.sh -c esp32s3 -s -f
          # (inits the esp-idf submodule, cmake-builds the IDF 2nd-stage
          # bootloader with the xtensa toolchain already in PATH, then
          # gen_esp32part for the table) and COPYFILEs BOTH products to
          # TOPDIR.  There is NO separate partition_table target.
          # ------------------------------------------------------------------
          {
            echo "== boot format in .config: =="
            grep -E 'APP_FORMAT|SIMPLE_BOOT|PARTITION_TABLE_OFFSET|FLASH_(16M|MODE|FREQ)' nuttx/.config || true
            # run#42: the IDF bootloader cmake died at build.cmake:542 with
            #   ModuleNotFoundError: No module named 'idf_component_manager'
            # build_idfboot.sh passes -DPYTHON_DEPS_CHECKED=1, which only
            # SKIPS the dependency check -- it installs nothing.  Install
            # it up front into the same interpreter cmake uses
            # (/usr/bin/python == python3 via python-is-python3; pip
            # defaults to --user here, run#38 forensics).
            echo "== ensure idf_component_manager =="
            # --upgrade-strategy eager: upgrade ALL deps to their latest into
            # the user site.  The runner's /usr/lib/python3/dist-packages
            # carries stale versions (pyparsing 2.4.7, requests 2.25.1,
            # click 8.0.3, ...) and pip's default "only-if-needed" strategy
            # treats them as satisfied, so every unversioned dep had to be
            # re-fixed by hand: run#43 = OpAssoc (pyparsing), run#44 =
            # JSONDecodeError (requests.exceptions, requests>=2.27).  eager
            # installs the whole tree fresh into ~/.local, which precedes
            # dist-packages on sys.path -- one shot instead of whack-a-mole.
            { python3 -m pip install --user --upgrade --upgrade-strategy eager idf-component-manager \
                || python3 -m pip install --upgrade --upgrade-strategy eager idf-component-manager \
                || python3 -m pip install --user --break-system-packages --upgrade --upgrade-strategy eager idf-component-manager; } \
              || { echo "== IDF-COMPONENT-MANAGER INSTALL FAILED =="; exit 1; }
            # run#43: pip found the system pyparsing 2.4.7 in
            # /usr/lib/python3/dist-packages and treated the (unversioned)
            # dependency as satisfied, so it never installed a newer one;
            # the real CLI entry then died on a pyparsing 3.x-only API:
            #   ImportError: cannot import name 'OpAssoc' from 'pyparsing'
            # Force-upgrade pyparsing into the user site (which precedes
            # dist-packages on sys.path).
            { python3 -m pip install --user --upgrade "pyparsing>=3.0" \
                || python3 -m pip install --user --break-system-packages --upgrade "pyparsing>=3.0"; } \
              || { echo "== PYPARSING INSTALL FAILED =="; exit 1; }
            # Deep import check (run#43 lesson): idf_component_manager's
            # __init__ is lazy -- the shallow `import idf_component_manager`
            # check passed while the actual entry died at
            # core.py:59 -> idf_component_tools.manifest -> ... ->
            # if_parser -> pyparsing.  Importing .core walks that whole
            # chain and catches any other shadowed/missing dep.
            python3 -c "import idf_component_manager.core, sys; print('idf_component_manager.core OK on', sys.executable)" \
              || { echo "== IDF-COMPONENT-MANAGER IMPORT FAILED =="; exit 1; }
            # run#45 (esp-idf@1559b63 forensics): project.cmake does
            #   if(NOT "$ENV{IDF_COMPONENT_MANAGER}" EQUAL "0")
            #     idf_build_set_property(IDF_COMPONENT_MANAGER 1)
            #   idf_build_set_property(__COMPONENT_MANAGER_INTERFACE_VERSION 2)
            # so the cmake stage invokes
            #   python -m idf_component_manager.prepare_components
            #     --interface_version=2 ...
            # and icm 3.1.2 rejects version 2 ("invalid choice: 2 (choose
            # from 4, 5, 6)").  The bootloader project only uses built-in
            # IDF components, so export IDF_COMPONENT_MANAGER=0: the
            # idf_build_process in build.cmake then SKIPS the
            # prepare_components call entirely (the property stays at the
            # 0 default from __build_init; no managed components involved).
            export IDF_COMPONENT_MANAGER=0
            echo "IDF_COMPONENT_MANAGER=$IDF_COMPONENT_MANAGER"
            # run#46/#47: with the component manager skipped, the next gate
            # is sdkconfig generation -- kconfig.cmake invokes
            #   python -m kconfgen --kconfig <IDF>/Kconfig ...
            # and died with "/usr/bin/python: No module named kconfgen".
            # run#47 forensics settled WHERE kconfgen comes from at this
            # esp-idf commit (1559b63, 2023-03-13):
            #   - tools/kconfgen.py             -> 404 (not in tree)
            #   - tools/kconfig_new/kconfgen.py -> 404 (not in tree either)
            #   - tools/kconfig_new/confgen.py (260B) is a pure shim:
            #       sys.exit(subprocess.run([sys.executable, '-m', 'kconfgen'] + sys.argv[1:]))
            #   - kconfig.cmake sets NO PYTHONPATH: kconfgen_basecommand is
            #     a bare `${python} -m kconfgen`, i.e. kconfgen must be an
            #     INSTALLED module of the python env.
            # The provider is the pip package `esp-idf-kconfig`, listed in
            # tools/requirements/requirements.core.txt (same file as
            # idf-component-manager).  A normal IDF setup installs it via
            # install.py -- which Bootloader.mk never runs, so it was
            # missing.  The run#46 PYTHONPATH export pointed at <IDF>/tools
            # and was useless; it is gone now.
            # Pin ==1.1.0: the version current when this esp-idf master
            # snapshot was cut (1.2.0 only landed 2023-07).  1.x is a
            # kconfiglib wrapper with a minimal dep tree (kconfiglib is
            # already installed in this step); 3.x pulls textual/esp-pylib
            # and its top-level module layout could not be verified from
            # PyPI metadata -- not worth the risk.
            { python3 -m pip install --user "esp-idf-kconfig==1.1.0" \
                || python3 -m pip install "esp-idf-kconfig==1.1.0" \
                || python3 -m pip install --user --break-system-packages "esp-idf-kconfig==1.1.0" \
                || python3 -m pip install --user esp-idf-kconfig; } \
              || { echo "== ESP-IDF-KCONFIG INSTALL FAILED =="; exit 1; }
            # Deep check (run#43 lesson): verify the EXACT module name the
            # cmake will invoke, before spending 15 minutes in make.
            python3 -c "import kconfgen, sys; print('kconfgen OK on', sys.executable, kconfgen.__file__)" \
              || { echo "== KCONFGEN IMPORT FAILED =="; exit 1; }
            echo "== make -C nuttx bootloader =="
            make -C nuttx bootloader 2>&1 || echo "== BOOTLOADER MAKE FAILED (full output above) =="
            echo "== bootloader products in nuttx/: =="
            ls -la nuttx/bootloader-esp32s3.bin nuttx/partition-table-esp32s3.bin 2>&1 || true
          } >> build.log 2>&1

      - name: Collect firmware (merge if needed)
        if: always()
        working-directory: openvela
        run: |
          mkdir -p firmware
          # run#39: only nuttx.bin surfaced at depth<=2.  The bootloader
          # (esp-hal-3rdparty build) and the partition table live deeper
          # in the tree -- search FULL depth and record every .bin found
          # (binlist.txt ships in the firmware branch as forensics).
          find nuttx -name '*.bin' -exec ls -la {} \; > binlist.txt 2>&1 || true
          tail -c 3000 binlist.txt || true
          find nuttx -name 'nuttx.bin'                   -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'bootloader-esp32s3.bin'      -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'partition-table-esp32s3.bin' -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'bootloader*.bin'             -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'partition*.bin'              -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'mcuboot*.bin'                -exec cp -v {} firmware/ \; 2>/dev/null || true
          find nuttx -name 'nuttx.merged.bin'            -exec cp -v {} firmware/ \; 2>/dev/null || true
          cp -v binlist.txt firmware/ 2>/dev/null || true
          # run#41 forensics gap: the Publish step runs only on success and
          # the logs branch only on failure, so the bootloader make output
          # was invisible on success.  Ship the build.log tail WITH the
          # firmware itself (Collect runs `if: always()`).
          tail -c 3000000 build.log > firmware/build_tail.log 2>/dev/null || true
          ls -la firmware || true
          # run#48 forensics: the bootloader built for the first time
          # (kconfgen fix ac96470 worked -- 108/108, both products landed
          # in nuttx/), so this merge ran for the FIRST time -- and
          # failed: its flags were written in esptool 5.x kebab-case
          # (--flash-mode), but esptool is pinned to 4.8.1 whose argparse
          # only accepts underscore spelling (--flash_mode; argparse does
          # not interchange dashes/underscores).  step_outcomes.txt does
          # not track the Collect step, so this failure was invisible
          # except for the untouched firmware branch.  Fix: 4.x spelling
          # + ship the merge transcript as collect.log (failure path
          # publishes it to the logs branch for forensics).
          if [ ! -f firmware/nuttx.merged.bin ] && [ -f firmware/bootloader-esp32s3.bin ] && [ -f firmware/partition-table-esp32s3.bin ] && [ -f firmware/nuttx.bin ]; then
            { python3 -m esptool --chip esp32s3 merge_bin -o firmware/nuttx.merged.bin \
                --flash_mode dio --flash_freq keep --flash_size keep \
                0x0 firmware/bootloader-esp32s3.bin 0x8000 firmware/partition-table-esp32s3.bin 0x10000 firmware/nuttx.bin; } > collect.log 2>&1 \
              || { echo "== MERGE_BIN FAILED, transcript: =="; cat collect.log; exit 1; }
            echo "MERGE OK"
          fi
          cp -v collect.log firmware/ 2>/dev/null || true
          ls -la firmware || true

      - name: Publish firmware to firmware branch (SSH-pullable)
        if: success()
        run: |
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/fw && cd /tmp/fw
          git init -q -b firmware .
          cp "${{ github.workspace }}/openvela/firmware/"* .
          git add -A
          git commit -q -m "firmware build run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin firmware --force
          echo "固件已推送到 firmware 分支"

      - name: Publish build log to logs branch on failure
        if: failure()
        run: |
          # Step-level forensics (run#36 died with zero logs: which step?):
          echo "=== STEP OUTCOMES ===" | tee step_outcomes.txt
          echo "deps: ${{ steps.deps.outcome }}" | tee -a step_outcomes.txt
          echo "toolchain: ${{ steps.toolchain.outcome }}" | tee -a step_outcomes.txt
          echo "sync: ${{ steps.sync.outcome }}" | tee -a step_outcomes.txt
          echo "bsp: ${{ steps.bsp.outcome }}" | tee -a step_outcomes.txt
          echo "build: ${{ steps.build.outcome }}" | tee -a step_outcomes.txt
          tail -c 2000000 openvela/build.log > build_tail.log 2>/dev/null || echo "no build.log" > build_tail.log
          tail -c 2000000 openvela/sync.log > sync_tail.log 2>/dev/null || echo "no sync.log" > sync_tail.log
          tail -c 2000000 openvela/init.log > init_tail.log 2>/dev/null || echo "no init.log" > init_tail.log
          ls -la openvela > dirlist.txt 2>&1 || true
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b logs .
          cp "${{ github.workspace }}/step_outcomes.txt" .
          cp "${{ github.workspace }}/pip_esptool.log" . 2>/dev/null || true
          # run#48: the Collect step is not tracked by step_outcomes.txt
          # and its merge transcript used to be lost on failure -- ship it.
          cp "${{ github.workspace }}/openvela/collect.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/build_tail.log" .
          cp "${{ github.workspace }}/sync_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/init_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/dirlist.txt" . 2>/dev/null || true
          git add -A
          git commit -q -m "build log run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin logs --force
          echo "日志已推送到 logs 分支"
