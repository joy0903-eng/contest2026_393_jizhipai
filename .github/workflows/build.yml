name: Build AI-VOX3 OpenVela firmware

on:
  push:
    branches: [dev-ai-contest-2026]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout team repo
        uses: actions/checkout@v4
        with:
          path: team_repo
          fetch-depth: 1

      - name: Install build deps + repo tool (fail loud)
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl wget xz-utils unzip build-essential \
            cmake ninja-build python3 python3-pip python3-dev rsync \
            libc++abi-dev flex bison gperf libncurses-dev libssl-dev libffi-dev \
            libusb-1.0-0-dev pkg-config device-tree-compiler u-boot-tools python-is-python3
          git lfs install
          sudo curl -fSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          test -s /usr/local/bin/repo || { echo "repo 下载失败"; exit 1; }
          repo --version
          # ESPTOOL (run#36..#38 forensics): three stacked problems.
          #  a) the runner PRE-INSTALLS esptool 4.7.0, so the old bare
          #     `pip install esptool` was a successful no-op (run#35 built
          #     with 4.7.0 and died at MKIMAGE);
          #  b) system site-packages is not writable -> pip defaults to
          #     --user installs (fine: ~/.local precedes system site);
          #  c) the stock pip 22.x CANNOT build new esptool sdists -- the
          #     generated metadata carries project name 'unknown', so every
          #     candidate >= 4.8.0 gets discarded ('inconsistent name'), and
          #     pip 22.x does not even know --break-system-packages.
          # Fix: upgrade pip FIRST (its own wheel is unaffected by c),
          # then install esptool 4.8.1 -- satisfies the MKIMAGE gate
          # (>= 4.8.0) with 4.x-era CLI behavior.
          { python3 -m pip install --user --upgrade pip \
              || python3 -m pip install --upgrade pip; } > pip_esptool.log 2>&1 || true
          { python3 -m pip install --user --upgrade "esptool==4.8.1" \
              || python3 -m pip install --upgrade "esptool==4.8.1"; } >> pip_esptool.log 2>&1 \
            || { echo "== ESPTOOL INSTALL FAILED, transcript: =="; cat pip_esptool.log; exit 1; }
          { echo "== esptool as the build will see it: ==";
            python3 -m esptool version || true;
            python3 -c "import esptool; print('module:', esptool.__file__, esptool.__version__)" || true;
            which esptool.py || true; } 2>&1
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela Contest CI"
          git config --global http.postBuffer 524288000

      - name: Install xtensa-esp32s3-elf toolchain 12.2.0 (single-dash names, matches Make.defs)
        id: toolchain
        run: |
          wget -c "https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" -O /tmp/xt.tar.gz
          sudo tar -xf /tmp/xt.tar.gz -C /opt
          echo "/opt/xtensa-esp32s3-elf/bin" >> $GITHUB_PATH
          xtensa-esp32s3-elf-gcc --version | head -n1

      - name: repo init + sync (official full manifest, fail loud)
        id: sync
        run: |
          mkdir -p openvela
          cd openvela
          { which repo; repo --version; } > init.log 2>&1 || echo "!! repo 检查失败" >> init.log
          repo init -u https://github.com/open-vela/manifests.git \
            -b dev-ai-contest-2026 -m openvela.xml --git-lfs >> init.log 2>&1 \
            || { echo "== INIT FAILED ==" >> init.log; exit 1; }
          echo "INIT OK" >> init.log
          (repo sync -c -j4 --no-tags) >> sync.log 2>&1 \
            || { echo "== SYNC FAILED ==" >> sync.log; exit 1; }
          echo "SYNC OK" >> sync.log
          echo "=== 自检 ===" >> sync.log
          ls -la build.sh >> sync.log 2>&1 || true

      - name: Install AI-VOX3 BSP + app (validated staging layout, Make flow)
        id: bsp
        # ------------------------------------------------------------------
        # run#58 AND run#59 FORENSICS FAILURE -- FIXED HERE
        # Both runs failed with `bsp: failure` and we could NOT see why, because
        # this step's stdout was never captured anywhere.  `Publish build log to
        # logs branch` only tails build.log / sync.log / init.log, and build.log
        # is created by the NEXT step -- so the bsp step was a blind spot.
        # Being blind is what turned one bug into three lost CI cycles.
        #
        # Now the whole step body runs inside `{ ... } 2>&1 | tee bsp.log`, so
        # every command's output (including `set -x` traces and every FATAL
        # message) lands in bsp.log, which the Publish step below ships.
        # ------------------------------------------------------------------
        run: |
          {
          set -x
          # ------------------------------------------------------------------
          # run#58 POST-MORTEM -- WHY THIS STEP IS SO DEFENSIVE
          # run#58 died here with `bsp: failure`, a bare step status, and NO
          # output anywhere: not even the later patch loop's unconditional
          # `echo "== NUTTX PATCH:"` ever appeared.  The abort was therefore in
          # these first few lines, and it was SILENT.
          #
          # Mechanism (proved in toolchain/prove_l95.sh, results in
          # toolchain/build/prove_result.txt):
          #   A redirect (`>>`) into a directory that does not exist FAILS.
          #   Under GitHub Actions' `bash -e` that is fatal, and when the
          #   command also carries `2>/dev/null` the reason is discarded --
          #   so the step dies printing nothing at all.
          #   C1: parent dir exists, file missing -> rc=0 (>> auto-creates).
          #   C2: parent dir MISSING                -> rc=1, NO OUTPUT.  <-- run#58
          #   C3: same as C2 without 2>/dev/null     -> "No such file or directory".
          #
          # So every directory we are about to write into must be created (or
          # proven to exist) BEFORE the first write, and no write may have its
          # stderr suppressed.  We also emit SECTION markers so that if this
          # step ever fails again, the log names the exact block.
          # ------------------------------------------------------------------
          echo "== BSP SECTION 1/3: staging copies =="
          # `openvela/apps` comes from the `apps` repo that `repo sync` fetches;
          # it is NOT part of our team repo.  Create the parents before any
          # copy/write so a missing tree fails LOUD instead of silently.
          mkdir -p openvela/apps/examples
          mkdir -p openvela/vendor/espressif/boards/esp32s3
          if [ ! -d openvela/apps/examples ]; then
            echo "== BSP FATAL: openvela/apps/examples missing after mkdir -p =="
            echo "   repo sync did not materialise the apps tree."
            exit 1
          fi
          if [ ! -d openvela/nuttx ]; then
            echo "== BSP FATAL: openvela/nuttx missing -- repo sync incomplete =="
            exit 1
          fi
          # Prove the staging sources exist BEFORE copying.  A missing source
          # here is the most likely cause of a silent abort, and `cp -r` with a
          # missing source prints only to stderr -- which we now capture, but a
          # named check is far clearer than a bare cp error.
          for src in team_repo/staging/vendor_espressif/boards/esp32s3/ai_vox3 \
                     team_repo/staging/apps/examples/desktop_companion \
                     team_repo/staging/vendor_espressif/boards/esp32s3/common ; do
            if [ ! -e "$src" ]; then
              echo "== BSP FATAL: staging source missing: $src =="
              echo "   (the checkout did not contain it -- check the commit)"
              echo "   --- team_repo/staging tree ---"
              find team_repo/staging -maxdepth 4 2>&1 | head -60 || true
              exit 1
            fi
            echo "  staging source OK: $src"
          done
          echo "== BSP SECTION 1/3: staging copies =="
          set +x
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/ai_vox3 openvela/vendor/espressif/boards/esp32s3/ai_vox3
          cp -r team_repo/staging/apps/examples/desktop_companion openvela/apps/examples/desktop_companion
          # Register the app Kconfig with an ABSOLUTE source path — mirrors mkkconfig.sh
          # output exactly ("source \"<abs path>\": relative paths fail because $srctree
          # is unset when olddefconfig parses the apps tree (run#19 root cause).
          #
          # NOTE the carefully asymmetric guards below:
          #   * the GREP keeps 2>/dev/null (it is a probe; its silence is intended)
          #   * the REDIRECT must never suppress stderr, and its parent dir has
          #     just been mkdir -p'd above.
          if [ ! -d openvela/apps/examples ]; then
            echo "== BSP FATAL: cannot register Kconfig, directory vanished =="
            exit 1
          fi
          grep -q 'desktop_companion' openvela/apps/examples/Kconfig 2>/dev/null \
            || echo "source \"${{ github.workspace }}/openvela/apps/examples/desktop_companion/Kconfig\"" >> openvela/apps/examples/Kconfig
          echo "== BSP SECTION 1/3: staging copies DONE =="
          # Build registration ships as staging .../desktop_companion/Make.defs (official
          # per-example pattern; auto-included by apps/examples/Make.defs wildcard).
          cp -r team_repo/staging/vendor_espressif/boards/esp32s3/common openvela/vendor/espressif/boards/esp32s3/common
          # Vendor board-common must be REAL, not a stub (run#25/#26 root cause):
          # tools/Config.mk assigns BOARD_COMMON_DIR = $(BOARD_DIR)/../common whenever
          # that directory EXISTS (its else-branch has no CONFIG_ARCH_BOARD_COMMON
          # check), and scripts/Make.defs (ARCHSCRIPT) plus tools/Unix.mk (board
          # symlink) both dereference it.  With only the stub common/configs from
          # run#18, both dereferences hit an empty shell -> "No rule to make target"
          # for esp32s3_peripherals.ld AND libboard.a.  The .ld scripts are copied
          # from the in-tree nuttx so they always match the nuttx being built.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/scripts
          # Copy EVERY .ld: flat_memory.ld #includes esp32s3_aliases.ld which
          # pulls further scripts -- copying only 4 named files broke the
          # include chain (run#28: "esp32s3_aliases.ld: No such file").
          cp openvela/nuttx/boards/xtensa/esp32s3/common/scripts/*.ld \
             openvela/vendor/espressif/boards/esp32s3/common/scripts/ \
             || { echo "== LDSCRIPT COPY FAILED =="; exit 1; }
          # Diagnostic only -- must never be able to abort the step.
          ls -la openvela/vendor/espressif/boards/esp32s3/common/scripts || true
          # Keep the configs stub that configure's process_config.sh references.
          mkdir -p openvela/vendor/espressif/boards/esp32s3/common/configs
          # ------------------------------------------------------------------
          # NUTTX SOURCE PATCH MECHANISM.
          # `openvela/nuttx` is a repo-sync FETCH result from upstream
          # (manifest: <project path="nuttx" name="nuttx">) -- it is NOT part of
          # our team repo, so a fix to a nuttx file cannot be delivered by
          # simply committing it here.  This step is the patch seam: every
          # `*.patch` under staging/patches/ is applied to the synced tree with
          # `patch -p1` right after sync and before the build.  Idempotent:
          # if the change is already present (dry-run says so) we skip it.
          # Fail loud if a patch is neither applicable nor already applied --
          # a silently-dropped fix is worse than a red build.
          # ------------------------------------------------------------------
          PATCHDIR="$PWD/team_repo/staging/patches"
          echo "== BSP SECTION 2/3: nuttx patch loop (PATCHDIR=$PATCHDIR) =="
          # run#66: patches must be INDEPENDENT.  Previously the first failure
          # did `exit 1` on the spot, which aborted the whole loop -- and
          # because 0001 sorts before 0002, a broken 0001 meant 0002 was NEVER
          # EVEN TRIED.  That is precisely the run#66 sequence:
          #     0001 -> "Hunk #1 FAILED at 227" -> exit 1
          #     0002 -> never attempted -> --ram-only-header stayed in the tree
          #     -> 2-segment image -> ROM refuses to boot -> black screen
          # A failing patch is still fatal to the build (we do not want to ship
          # a half-patched tree), but it must not SKIP its siblings: apply all
          # of them, collect the failures, and fail once at the end with the
          # complete list.  That way one broken patch cannot hide another.
          patch_failures=0
          if [ -d "$PATCHDIR" ]; then
            shopt -s nullglob
            for p in "$PATCHDIR"/*.patch; do
              echo "== NUTTX PATCH: $(basename "$p") =="
              if (cd openvela/nuttx && patch -p1 --dry-run --forward < "$p" >/dev/null 2>&1); then
                (cd openvela/nuttx && patch -p1 --forward < "$p") \
                  || { echo "== NUTTX PATCH APPLY FAILED: $(basename "$p") =="; patch_failures=$((patch_failures+1)); }
                echo "applied: $(basename "$p")"
              elif (cd openvela/nuttx && patch -p1 --dry-run --reverse < "$p" >/dev/null 2>&1); then
                echo "already applied, skipping: $(basename "$p")"
              else
                echo "== NUTTX PATCH NOT APPLICABLE: $(basename "$p") =="
                # Print the actual patch diagnostics -- a bare "not applicable"
                # with no reason is what made earlier failures guesswork.
                (cd openvela/nuttx && patch -p1 --dry-run --forward < "$p") 2>&1 | head -30 || true
                patch_failures=$((patch_failures+1))
              fi
            done
            shopt -u nullglob
          else
            echo "no staging/patches directory -- no nuttx patches to apply"
          fi
          echo "== BSP SECTION 2/3: patch loop DONE (failures=$patch_failures) =="
          if [ "$patch_failures" != "0" ]; then
            echo "== BSP FATAL: $patch_failures patch(es) failed to apply -- refusing to build a half-patched tree =="
            exit 1
          fi
          echo "== BSP SECTION 3/3: patch verify gates =="
          # Prove the patch landed: the size-override must be present in the
          # synced source the compiler will read.
          if grep -q 'app_irom_size = segment_hdr.data_len;' \
               openvela/nuttx/arch/xtensa/src/common/espressif/esp_loader.c; then
            echo "PATCH VERIFY OK: map_rom_segments size override is in the tree"
          else
            echo "== PATCH VERIFY FAILED: esp_loader.c size override missing =="
            echo "   (the IllegalInstruction workaround did NOT land -- do not flash this build)"
            exit 1
          fi
          # Self-check: the elf2image command line must no longer contain
          # --ram-only-header.  If it does, the patch did not land and we would
          # ship a 2-segment image that this board's ROM silently refuses to
          # boot (serial shows 0 bytes -- see 0002-esp32s3-Config.mk-*.patch).
          #
          # NOTE: do NOT append these to build.log.  build.log is created by the
          # NEXT step (the build step, which sets working-directory: openvela);
          # at bsp time it does not exist in this CWD, and under GitHub's
          # `bash -e` a failed redirect aborts the step on the spot.  That is
          # exactly what killed run#58: the step died here with NO message,
          # leaving a 13-byte build_tail.log and a bare `bsp: failure`.
          # Write to stdout instead -- step output is captured by Actions and
          # survives regardless of whether later steps ever run.
          if grep -q 'ram-only-header' openvela/nuttx/tools/esp32s3/Config.mk; then
            echo "== PATCH CHECK FAILED: tools/esp32s3/Config.mk still has --ram-only-header =="
            exit 1
          fi
          echo "PATCH CHECK OK: --ram-only-header removed from tools/esp32s3/Config.mk"
          echo "== BSP SECTION 3/3: verify gates DONE =="
          echo "BSP+应用已就位"
          echo "--- apps/examples/Kconfig ---"
          # Diagnostic only.
          cat openvela/apps/examples/Kconfig || true
          echo "== BSP DONE (all sections) =="
          } 2>&1 | tee bsp.log
          
          # run#66: the body's exit status was being DISCARDED, so every
          # `exit 1` inside the braces above was silently swallowed and the
          # step reported success even when the patch loop aborted.  Proof from
          # run#66's own bsp.log (the first run where bsp.log was actually
          # captured):
          #     == NUTTX PATCH NOT APPLICABLE: 0001-...patch ==
          #     checking file arch/xtensa/src/common/espressif/esp_loader.c
          #     Hunk #1 FAILED at 227.
          #     1 out of 1 hunk FAILED
          # and then the log simply STOPS -- no "SECTION 3/3", no "patch loop
          # DONE", no sign of 0002.  The loop aborted at patch 0001 via the
          # `exit 1` on the NOT APPLICABLE branch, so patch 0002 was NEVER
          # TRIED, --ram-only-header stayed in the tree, and every build since
          # run#58 produced a 2-segment bootloader-refused image.  That is the
          # black screen.  And because the step still said `success`, nobody
          # could see it.
          #
          # Why: `{ ... } 2>&1 | tee bsp.log` runs the body in a SUBSHELL, and
          # a pipeline's status is the LAST command's -- `tee`, which always
          # succeeds.  The previous comment claimed "bash -e already aborted on
          # the first failing command inside the braces"; that is FALSE for a
          # pipeline, so nothing aborted.  The `== BSP FATAL` backstop below
          # could not help either: the exit-1 paths never print that marker.
          # Read the pipe's real status from PIPESTATUS instead of guessing.
          body_rc="${PIPESTATUS[0]}"
          if [ "$body_rc" != "0" ]; then
            echo "== BSP FATAL: body exited $body_rc (see bsp.log above for the aborting command)"
            exit "$body_rc"
          fi
          # Belt-and-braces: a successful body must have reached the last
          # section.  If these markers are absent the body died early even
          # though PIPESTATUS somehow read 0.
          for marker in 'SECTION 3/3: verify gates DONE' 'BSP DONE (all sections)'; do
            if ! grep -q "$marker" bsp.log; then
              echo "== BSP FATAL: bsp.log is missing required marker: $marker"
              exit 1
            fi
          done
          echo "bsp.log size: $(stat -c%s bsp.log 2>/dev/null || echo '?') bytes"

      - name: Build AI-VOX3 openvela config (official m() Makefile chain via VELA_USE_MAKEFILE=1)
        id: build
        working-directory: openvela
        run: |
          CFG="vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela"
          pip3 install --quiet kconfiglib || pip install --quiet kconfiglib || true
          { echo "PWD=$PWD"; ls -d nuttx apps build vendor/espressif/boards/esp32s3/ai_vox3 2>&1; } > build.log 2>&1 || true
          source build/envsetup.sh >> build.log 2>&1 || { echo "== ENSETUP FAILED ==" >> build.log; exit 1; }
          echo "ENSETUP OK" >> build.log
          lunch "$CFG" >> build.log 2>&1 || { echo "== LUNCH FAILED ==" >> build.log; exit 1; }
          echo "LUNCH OK" >> build.log
          # ------------------------------------------------------------------
          # AUDIT GATE FIX (run#32): with the Makefile chain `lunch` only
          # records the selection -- nuttx/.config is created later by
          # _do_makefile_build INSIDE `m` (open-vela/build envsetup.sh,
          # verbatim: "if [ ! -r $T/nuttx/.config ]; then
          #   ${TOOLSDIR}/configure.sh -e $T/nuttx/${BOARD_CONFIG}; fi",
          # BOARD_CONFIG = ../vendor/<v>/boards/<b>/configs/<c>), so the
          # audit below silently no-opped ("WARN: .config not found after
          # lunch; audit skipped" -- run#32 log line 15) and the NOINLINE
          # check never ran.  Pre-generate .config here with the EXACT same
          # command; `m` then sees an existing .config ([ ! -r ] fails) and
          # skips its own configure, so this .config IS the one the build
          # consumes, and the audit finally runs BEFORE the 40-min compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            nuttx/tools/configure.sh -e "$PWD/nuttx/../vendor/espressif/boards/esp32s3/ai_vox3/configs/openvela" >> build.log 2>&1 \
              || { echo "== PRE-CONFIGURE FAILED ==" >> build.log; exit 1; }
            echo "PRE-CONFIGURE OK (.config materialized before audit)" >> build.log
          fi
          # ------------------------------------------------------------------
          # CONFIG AUDIT: olddefconfig silently drops defconfig lines whose
          # Kconfig deps are unmet (run#29 root cause: AUDIO_ES8311 lives
          # behind the unset DRIVERS_AUDIO umbrella -> es8311.h compiled
          # empty). Fail loud HERE instead of 40 minutes into the compile.
          # ------------------------------------------------------------------
          if [ ! -f nuttx/.config ]; then
            echo "== AUDIT GATE FAILED: .config still missing after pre-configure ==" >> build.log
            exit 1
          fi
          echo "== CONFIG AUDIT ==" >> build.log
          grep -E '^CONFIG_(AUDIO|DRIVERS_AUDIO|I2C|I2S|ES8311|LCD_ST7789|ESP32S3_SPI2|ESP32S3_APP_FORMAT|ESPRESSIF)' nuttx/.config >> build.log || true
          # Diagnostics for the run#32 link fixes (A: task_tls, B: nxmutex):
          grep -E 'NOINLINE|TLS_TASK_NELEM' nuttx/.config >> build.log || true
          for sym in CONFIG_AUDIO=y CONFIG_DRIVERS_AUDIO=y CONFIG_AUDIO_ES8311=y CONFIG_AUDIO_I2S=y CONFIG_I2C=y CONFIG_I2S=y CONFIG_ESP32S3_I2C0=y CONFIG_ESP32S3_I2C0_MASTER_MODE=y CONFIG_ESPRESSIF_I2C_PERIPH_MASTER_MODE=y CONFIG_ESP32S3_I2S=y CONFIG_ESP32S3_SPI2=y CONFIG_LCD_ST7789=y CONFIG_AI_VOX3_SERVO=y CONFIG_AI_VOX3_BUTTONS=y CONFIG_ESP32S3_LEDC=y CONFIG_ESP32S3_LEDC_TIM0=y CONFIG_ESP32S3_LEDC_TIM0_CHANNELS=1 CONFIG_ESP32S3_LEDC_CHANNEL0_PIN=42 CONFIG_ESP32S3_LEDC_CHANNEL1_PIN=43 CONFIG_ESP32S3_LEDC_CHANNEL2_PIN=44 CONFIG_ESP32S3_LEDC_CHANNEL3_PIN=48 CONFIG_ESP32S3_GPIO_IRQ=y CONFIG_TLS_TASK_NELEM=8 CONFIG_ESP32S3_USBSERIAL=y CONFIG_LV_COLOR_DEPTH=16 CONFIG_LV_USE_CLIB_MALLOC=y CONFIG_INIT_ENTRYPOINT='"desktop_companion_main"'; do
            grep -qx "$sym" nuttx/.config || { echo "== CONFIG AUDIT FAILED: $sym not in .config ==" >> build.log; exit 1; }
          done
          # SPIRAM is bisectable (run#71 boot bisection turns the whole block
          # off), so the PSRAM trio is only mandatory when SPIRAM itself is on:
          if grep -qx 'CONFIG_ESP32S3_SPIRAM=y' nuttx/.config; then
            for sym in CONFIG_ESP32S3_SPIRAM_MODE_OCT=y CONFIG_ESP32S3_SPIRAM_BOOT_INIT=y CONFIG_ESP32S3_SPIRAM_COMMON_HEAP=y; do
              grep -qx "$sym" nuttx/.config || { echo "== CONFIG AUDIT FAILED: $sym not in .config ==" >> build.log; exit 1; }
            done
          fi
          # SIMPLE_BOOT gate: the board must boot straight from the ROM with no
          # 2nd-stage IDF bootloader.  If APP_FORMAT_LEGACY (or MCUBOOT) is ever
          # selected, ESPRESSIF_SIMPLE_BOOT is silently disabled by its
          # depends-on and we end up on an IDF bootloader whose chip-revision
          # check rejects this ESP32-S3 (revision v0.2) -- symptom: dark LCD,
          # zero bytes on the USB-Serial/JTAG console.
          if grep -qE '^CONFIG_ESP32S3_APP_FORMAT_(LEGACY|MCUBOOT)=y' nuttx/.config; then
            echo "== CONFIG AUDIT FAILED: an APP_FORMAT is selected -> SIMPLE_BOOT is off ==" >> build.log
            grep -E 'APP_FORMAT|SIMPLE_BOOT' nuttx/.config >> build.log || true
            exit 1
          fi
          if ! grep -qE '^CONFIG_ESPRESSIF_SIMPLE_BOOT=y' nuttx/.config; then
            echo "== CONFIG AUDIT FAILED: ESSPRESSIF_SIMPLE_BOOT is not y (direct boot expected) ==" >> build.log
            grep -E 'SIMPLE_BOOT|APP_FORMAT' nuttx/.config >> build.log || true
            exit 1
          fi
          { echo "== SPIRAM / LVGL audit probes =="
            grep -n 'SPIRAM' nuttx/.config || echo "  (no SPIRAM symbol in .config at all)"
            # NOTE: probe LV_* (the real LVGL symbols), NOT LVGL_* -- the
            # latter prefix does not exist in LVGL's Kconfig, so an LVGL_*
            # grep matches nothing and tells us nothing.  See the LVGL block
            # in the board defconfig for the full story.
            grep -nE 'LV_COLOR_DEPTH|LV_USE_(CLIB|BUILTIN)_MALLOC|LV_USE_DEMO_WIDGETS' nuttx/.config \
              || echo "  (no LV_* symbol in .config at all)"; } >> build.log
          # nxmutex link fix (run#31): the mutex impl must stay inline.
          grep -qx '# CONFIG_LIBC_SEM_MUTEX_NOINLINE is not set' nuttx/.config || { echo "== CONFIG AUDIT FAILED: CONFIG_LIBC_SEM_MUTEX_NOINLINE must be off ==" >> build.log; exit 1; }
          echo "CONFIG AUDIT OK" >> build.log
          # ------------------------------------------------------------------
          # Pre-seed esp-hal-3rdparty at the pinned commit and fix its lock
          # initializer BEFORE the build's own clone step (run#23/#24):
          # OpenVela's nuttx defines spinlock_t as a STRUCT unconditionally
          # (include/nuttx/spinlock_type.h, all three branches), but
          # espressif/esp-hal-3rdparty@9fc713a initializes it with scalar 0
          # (components/esp_hw_support/clk_ctrl_os.c:39
          #   "static lock_type_t periph_spinlock = LOCK_INITIALIZER_UNLOCKED"
          #  with LOCK_INITIALIZER_UNLOCKED hard-coded to 0 under __NuttX__)
          # -> "error: invalid initializer" regardless of CONFIG_SMP.
          # The build's context target skips its clone when the directory
          # already exists, so we clone the pinned commit, rewrite the
          # initializer to SP_UNLOCKED (defined by all spinlock_type.h
          # branches), and let the normal build proceed on top.
          # ------------------------------------------------------------------
          {
            mkdir -p nuttx/arch/xtensa/src/esp32s3
            if [ ! -e nuttx/arch/xtensa/src/chip ]; then ln -s esp32s3 nuttx/arch/xtensa/src/chip; fi
            HALDIR="nuttx/arch/xtensa/src/esp32s3/esp-hal-3rdparty"
            if [ ! -d "$HALDIR" ]; then
              rm -rf "$HALDIR"
              git init -q "$HALDIR"
              git -C "$HALDIR" remote add origin https://github.com/espressif/esp-hal-3rdparty.git
              git -C "$HALDIR" fetch -q --depth 1 origin 9fc713a95b1ff150dd0b0647e465d3c624056bb1 \
                || { rm -rf "$HALDIR"; git clone -q https://github.com/espressif/esp-hal-3rdparty.git "$HALDIR"; }
              git -C "$HALDIR" checkout -q FETCH_HEAD 2>/dev/null || git -C "$HALDIR" checkout -q 9fc713a95b1ff150dd0b0647e465d3c624056bb1
            fi
            grep -rl "LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components" | xargs -r sed -i \
              's/^#define LOCK_INITIALIZER_UNLOCKED[[:space:]]*0[[:space:]]*$/#define LOCK_INITIALIZER_UNLOCKED SP_UNLOCKED/'
            echo "== esp-hal-3rdparty pre-seeded, lock-init patched: =="
            # `|| true`: this is a DIAGNOSTIC.  grep exits 1 when the pattern
            # is absent, and under GitHub's `bash -e` that would abort the step
            # -- turning a cosmetic log line into a hard build failure.  The
            # patch outcome is verified by the compile itself.
            grep -n "define LOCK_INITIALIZER_UNLOCKED" "$HALDIR/components/esp_hw_support/clk_ctrl_os.c" || true
          } >> build.log 2>&1 || { echo "== HAL PRESEED FAILED ==" >> build.log; exit 1; }
          echo "HAL PRESEED OK" >> build.log
          # ------------------------------------------------------------------
          # ESPTOOL VERSION GATE (run#35): the build reached MKIMAGE
          # ("MKIMAGE: ESP32-S3 binary") and died with
          #   "Unsupported esptool version: 4.7.0 expects >= 4.8.0"
          # even though the deps step installed esptool — something inside
          # the provisioning chain pins or shadows it.  Install at the last
          # moment before `m` so nothing can downgrade it in between, and
          # record the exact version the build will see.
          # run#42 addendum: ">= 4.8.0" resolved to esptool 5.4.0 once the
          # deps step had upgraded pip.  MKIMAGE survived 5.x, but esptool 5
          # renamed commands (merge_bin -> merge-bin) and the Collect-step
          # merge uses the 4.x spelling -- pin ==4.8.1 exactly.
          # ------------------------------------------------------------------
          {
            python3 -m pip install --quiet --upgrade "esptool==4.8.1" \
              || pip install --quiet --upgrade "esptool==4.8.1" \
              || { echo "== ESPTOOL INSTALL FAILED =="; exit 1; }
            echo "== esptool version seen by the build: =="
            python3 -m esptool version || esptool.py version || true
            which esptool.py || true
          } >> build.log 2>&1 || { echo "== ESPTOOL PREP FAILED ==" >> build.log; exit 1; }
          echo "ESPTOOL OK" >> build.log
          # ------------------------------------------------------------------
          # ZERO-LOAD-ADDRESS GATE, part 1/3: materialise the checker.
          #
          # 2026-09-17, decided by REAL HARDWARE, not by reasoning.
          #
          # The board flashed with the run#68/#69 image (787632 bytes, md5
          # 71e92552cc0fe0f73a3147a6cca5a8ae) prints:
          #     load:0x00000000,len:0x1528
          #     Guru Meditation Error: Core 0 panic'ed (StoreProhibited)
          #     EXCVADDR: 0x00000000
          #     A12     : 0x00001528        <-- == that segment's length
          #     Backtrace: 0x40045abc ...   <-- all in ROM
          # and then reboots forever (TG0WDT_SYS_RST).
          #
          # That falsifies what this repo used to believe.  We treated a
          # segment with load address 0 as harmless esptool flash-alignment
          # padding that "the ROM skips", citing
          #   nuttx/arch/xtensa/src/common/espressif/esp_loader.c:65
          #   #define IS_PADD(addr) (addr == 0)
          # That symbol is NuttX's OWN secondary loader.  This board is built
          # with CONFIG_ESPRESSIF_SIMPLE_BOOT=y, so there IS no second-stage
          # bootloader: ESP-ROM:esp32s3-20210327 parses nuttx.bin itself, and
          # it does not skip anything -- it copies data_len bytes to address 0
          # and takes a StoreProhibited store fault.  (ESP-IDF gets away with
          # these segments only because its own 2nd-stage bootloader, which
          # does skip them, is what parses the app image.)
          #
          # esptool itself just labels such a segment [PADDING] because its
          # per-chip table maps 0x00000000-0x00010000 to "PADDING".  That is
          # esptool's CLASSIFICATION, not a promise from the ROM.
          #
          # Origin of the segments (proved, not guessed): esptool elf2image
          # emits them as MMU-page (64 KB) alignment padding:
          #   esptool/bin_image.py save(), the "not self.ram_only_header"
          #   branch:  pad_segment = ImageSegment(0, b"\x00" * pad_len, ...)
          # with pad_len from get_alignment_data_needed().  For run#68/#69
          # that formula reproduces the observed length exactly:
          #   (0x10000 - 0xeac8) + (0x3c010000 % 0x10000 - 8) - 8 == 0x1528.
          # Not merge_bin (this workflow no longer has one) and not the
          # linker (the payload is literal 0x00 filler synthesised by esptool;
          # no ELF section has LMA 0).
          #
          # The checker below parses the ESP image header directly instead of
          # regex-scraping esptool's human-readable output.  Generated here
          # once and consumed by BOTH later gates (part 2 = verdict, part 3 =
          # Collect); /tmp is stable for the whole job.
          # ------------------------------------------------------------------
          cat > /tmp/segcheck.py <<'SEGCHECK_PY'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """ESP32-S3 firmware image segment checker (zero load-address gate).

          Parses the ESP image header DIRECTLY instead of regex-scraping esptool's
          human-readable output, and fails if any segment has load address 0.

          ESP image layout (ESP32-S3):
              offset 0x00   1 byte   magic                    (0xE9)
              offset 0x01   1 byte   segment count
              offset 0x02   1 byte   flash mode
              offset 0x03   1 byte   flash size + frequency
              offset 0x04   4 bytes  entry point              (LE u32)
              offset 0x08  16 bytes  extended header (wp pin, drive, chip id ...)
              offset 0x18           then, REPEATED once per segment:
                                        8 bytes  load_addr (LE u32) + data_len (LE u32)
                                        data_len bytes  segment payload
              after all segments     pad to 16 bytes, 1 checksum byte, 32-byte SHA-256

              NOTE: the 8-byte segment headers are INTERLEAVED with the payloads -- each
              header is immediately followed by its own segment's data.  There is no
              contiguous "segment table" at 0x18.  Verified against
              `esptool --chip esp32s3 image_info`, whose "File offs" column is the
              offset of each segment's 8-byte header.

          Why load_addr == 0 is fatal here (proved on real hardware 2026-09-17):
              NuttX's OWN secondary loader treats it as harmless padding:
                  nuttx/arch/xtensa/src/common/espressif/esp_loader.c:65
                  "#define IS_PADD(addr) (addr == 0)"
              but that symbol belongs to NuttX's loader, NOT to the chip ROM.  This
              project builds with CONFIG_ESPRESSIF_SIMPLE_BOOT=y, so there is no
              second-stage bootloader: the ROM itself parses nuttx.bin.  The ESP32-S3
              ROM (ESP-ROM:esp32s3-20210327) does not skip the segment -- it copies
              data_len bytes to address 0 and faults:
                  Guru Meditation Error: Core 0 panic'ed (StoreProhibited)
                  EXCVADDR: 0x00000000
              then reboots forever on TG0WDT_SYS_RST.  (esptool gets away with these
              segments everywhere else because ESP-IDF always parses its app image with
              a second-stage bootloader, which DOES skip them.)

          Exit status: 0 = PASS, 1 = FAIL (bad magic / truncated / zero load addr /
          too few segments).  The full segment table is printed on both paths.
          """

          from __future__ import annotations

          import os
          import struct
          import sys

          IMAGE_MAGIC = 0xE9
          HEADER_LEN = 24          # 8-byte common header + 16-byte ESP32-S3 extended header
          SEG_HEADER_LEN = 8       # load_addr (LE u32) + data_len (LE u32)
          MIN_SEGMENTS = 3         # healthy images here carry 5-6 segments


          class ImageError(Exception):
              """Raised when the image cannot be parsed or fails the gate."""


          def _hex(value: int) -> str:
              """Format a value as a fixed-width 32-bit hex string."""
              return "0x%08x" % (value & 0xFFFFFFFF)


          def parse_image(blob: bytes) -> dict:
              """Parse an ESP32-S3 firmware image.

              Args:
                  blob: The complete image file content.

              Returns:
                  Dict with ``segcount``, ``entry`` and ``segments``; each element of
                  ``segments`` is a dict with ``index``, ``load_addr``, ``data_len``,
                  ``hdr_off`` and ``data_off``.

              Raises:
                  ImageError: If the magic byte is wrong or any structure is truncated.
              """
              size = len(blob)
              min_size = HEADER_LEN + SEG_HEADER_LEN
              if size < min_size:
                  raise ImageError(
                      "file is only %d bytes -- not even a %d-byte image header plus one "
                      "%d-byte segment header (%d bytes); this is not a complete ESP "
                      "firmware image" % (size, HEADER_LEN, SEG_HEADER_LEN, min_size)
                  )

              magic = blob[0]
              if magic != IMAGE_MAGIC:
                  raise ImageError(
                      "bad image magic: byte 0 is 0x%02x, expected 0x%02x "
                      "(esp_image_header_t.magic) -- this is not an ESP firmware image"
                      % (magic, IMAGE_MAGIC)
                  )

              segcount = blob[1]
              entry = struct.unpack_from("<I", blob, 4)[0]

              if segcount < 1:
                  raise ImageError(
                      "header declares %d segments -- an image with no segments cannot "
                      "boot" % segcount
                  )

              segments = []
              off = HEADER_LEN
              for index in range(segcount):
                  if off + SEG_HEADER_LEN > size:
                      raise ImageError(
                          "segment table truncated: segment %d's 8-byte header needs file "
                          "offsets %d..%d, but the file is only %d bytes (header declares "
                          "%d segments)" % (index, off, off + SEG_HEADER_LEN, size, segcount)
                      )
                  load_addr, data_len = struct.unpack_from("<II", blob, off)
                  data_off = off + SEG_HEADER_LEN
                  if data_off + data_len > size:
                      raise ImageError(
                          "segment %d data truncated: it declares load_addr=%s data_len=%d "
                          "(0x%x) with payload at file offset %d, which needs %d bytes, but "
                          "the file is only %d bytes"
                          % (
                              index,
                              _hex(load_addr),
                              data_len,
                              data_len,
                              data_off,
                              data_off + data_len,
                              size,
                          )
                      )
                  segments.append(
                      {
                          "index": index,
                          "load_addr": load_addr,
                          "data_len": data_len,
                          "hdr_off": off,
                          "data_off": data_off,
                      }
                  )
                  off = data_off + data_len

              return {
                  "segcount": segcount,
                  "entry": entry,
                  "segments": segments,
                  "end_off": off,
              }


          def _pad_probe(blob: bytes, seg: dict) -> str:
              """Describe the payload of a zero-address segment (forensics only)."""
              payload = blob[seg["data_off"]:seg["data_off"] + seg["data_len"]]
              if not payload:
                  return "   payload: (empty)"
              first = " ".join("%02x" % b for b in payload[:16])
              if len(set(payload)) == 1:
                  filling = "all %d payload bytes are 0x%02x" % (len(payload), payload[0])
              else:
                  filling = "payload has mixed content"
              return "   payload[0:16]: %s | %s" % (first, filling)


          def render_table(path: str, blob: bytes, image: dict) -> str:
              """Render the whole segment table as a multi-line string."""
              lines = []
              lines.append("== ESP IMAGE SEGMENT TABLE: %s ==" % path)
              lines.append("   file size    : %d bytes" % len(blob))
              lines.append("   magic        : 0x%02x (ok)" % blob[0])
              lines.append("   segcount     : %d" % image["segcount"])
              lines.append("   entry point  : %s" % _hex(image["entry"]))
              lines.append("   first seg hdr: 0x%x  (%d-byte image header)" % (HEADER_LEN, HEADER_LEN))
              lines.append("   last byte of last segment data: 0x%x" % image["end_off"])
              lines.append("")
              lines.append(
                  "   %-4s %-12s %-10s %-10s %-10s %s"
                  % ("idx", "load_addr", "data_len", "hdr_off", "data_off", "note")
              )
              for seg in image["segments"]:
                  if seg["load_addr"] == 0:
                      note = "ZERO LOAD ADDR -- ROM FAULTS HERE"
                  else:
                      note = "-"
                  lines.append(
                      "   %-4d %-12s 0x%-8x 0x%-8x 0x%-8x %s"
                      % (
                          seg["index"],
                          _hex(seg["load_addr"]),
                          seg["data_len"],
                          seg["hdr_off"],
                          seg["data_off"],
                          note,
                      )
                  )
              for seg in image["segments"]:
                  if seg["load_addr"] == 0:
                      lines.append("")
                      lines.append(
                          "   seg%d load_addr=0x00000000 data_len=0x%x -- this is the segment "
                          "the ROM tries to copy to address 0."
                          % (seg["index"], seg["data_len"])
                      )
                      lines.append(_pad_probe(blob, seg))
              return "\n".join(lines)


          def check(path: str) -> int:
              """Check one image. Returns 0 on PASS, 1 on FAIL."""
              if not os.path.isfile(path):
                  sys.stdout.write("== ZERO-ADDR GATE FAIL: no such file: %s ==\n" % path)
                  return 1

              with open(path, "rb") as handle:
                  blob = handle.read()

              try:
                  image = parse_image(blob)
              except ImageError as exc:
                  sys.stdout.write("== ZERO-ADDR GATE FAIL: cannot parse image header ==\n")
                  sys.stdout.write("   %s\n" % exc)
                  sys.stdout.write("   A corrupt or non-ESP image is never bootable.\n")
                  return 1

              sys.stdout.write(render_table(path, blob, image) + "\n")

              zero_segments = [s for s in image["segments"] if s["load_addr"] == 0]
              problems = []
              if zero_segments:
                  problems.append(
                      "%d segment(s) with load address 0 (indexes: %s)"
                      % (
                          len(zero_segments),
                          ", ".join(str(s["index"]) for s in zero_segments),
                      )
                  )
              if image["segcount"] < MIN_SEGMENTS:
                  problems.append(
                      "segment count is %d, minimum for a healthy image is %d"
                      % (image["segcount"], MIN_SEGMENTS)
                  )

              # One value per line: the CI gates scrape these with an anchored
              # `sed -n 's/^KEY=\([0-9][0-9]*\).*/\1/p'`, so KEY must start the line.
              sys.stdout.write("\nSEGCOUNT=%d\n" % image["segcount"])
              sys.stdout.write("ZERO_LOAD_ADDR_SEGMENTS=%d\n" % len(zero_segments))

              if problems:
                  sys.stdout.write("== ZERO-ADDR GATE FAIL: %s ==\n" % "; ".join(problems))
                  sys.stdout.write(
                      "   A segment with load address 0 is NOT harmless padding on this\n"
                      "   board.  nuttx/arch/xtensa/src/common/espressif/esp_loader.c:65\n"
                      "   ('#define IS_PADD(addr) (addr == 0)') is NuttX's own SECONDARY\n"
                      "   loader, not the chip ROM.  This image is built with\n"
                      "   CONFIG_ESPRESSIF_SIMPLE_BOOT=y, so there is no second-stage\n"
                      "   bootloader: ESP-ROM:esp32s3-20210327 parses nuttx.bin itself, it\n"
                      "   does NOT skip a zero-address segment, it copies data_len bytes to\n"
                      "   address 0 and takes a StoreProhibited fault\n"
                      "   (Guru Meditation Error ... StoreProhibited, EXCVADDR:\n"
                      "   0x00000000), then reboots forever on TG0WDT_SYS_RST.\n"
                      "   run#68/#69 (787632 bytes, md5 71e92552cc0fe0f73a3147a6cca5a8ae)\n"
                      "   HAVE [IROM], [DROM] and a VALID Validation Hash and still brick\n"
                      "   for exactly this reason, which is why the IROM/DROM/hash gate\n"
                      "   alone is not sufficient.  esptool labels these segments\n"
                      "   [PADDING] purely because its per-chip table maps\n"
                      "   0x00000000-0x00010000 to 'PADDING'\n"
                      "   (esptool/targets/esp32s3.py MEMORY_MAP) -- that is esptool's\n"
                      "   classification, not a promise from the ROM.\n"
                      "   Origin: esptool elf2image MMU-page (64 KB) alignment padding,\n"
                      "   esptool/bin_image.py save(): pad_segment = ImageSegment(0, ...).\n"
                      "   Full segment table printed above.\n"
                  )
                  return 1

              sys.stdout.write(
                  "ZERO-ADDR GATE OK: segcount=%d, zero-load-address segments=0, entry=%s\n"
                  % (image["segcount"], _hex(image["entry"]))
              )
              return 0


          def main(argv: list) -> int:
              """Entry point. Returns 0 if every image passes, 1 otherwise."""
              args = [a for a in argv[1:] if a]
              if not args:
                  sys.stdout.write("usage: segcheck.py <image.bin> [<image.bin> ...]\n")
                  return 2
              rc = 0
              for path in args:
                  sys.stdout.write("-" * 78 + "\n")
                  if check(path) != 0:
                      rc = 1
              sys.stdout.write("-" * 78 + "\n")
              return rc


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          SEGCHECK_PY
          echo "segcheck.py generated: $(wc -l < /tmp/segcheck.py) lines" >> build.log
          # ------------------------------------------------------------------
          # ZERO-LOAD-ADDR RELOCATION script (run#68..#72).  esptool pads the
          # file so every flash-mapped segment starts on a 64 KB MMU page and
          # emits those pads as segments with load_addr 0 (esptool/bin_image.py
          # save(): ImageSegment(0, b"\x00"*pad_len)).  ESP-ROM:esp32s3-20210327
          # copies EVERY segment to its load address -- la=0 means memcpy to
          # 0x0 -> StoreProhibited, EXCVADDR 0x00000000 (real hardware,
          # run#68/#69).  The pad payloads are 100% zeros, so we repoint them
          # at scratch DRAM WITHOUT moving any bytes: the file offsets of the
          # flash-mapped segments stay put, which is exactly what preserves
          # their MMU page alignment.  0x3FC88000 is SRAM_DRAM_START; NuttX's
          # .dram0.data sits at 0x3FC9xxxx and .bss init happens after entry,
          # so the copies are harmless (hardware-proven: run#70/#72 with
          # relocated padding reach the app entry).  The XOR checksum covers
          # segment DATA only, so rewriting 4 la bytes keeps it valid.  The
          # appended SHA-256 digest DOES cover the headers, so it is refreshed
          # in place -- otherwise esptool image_info would flip to
          # "Validation Hash: ... (invalid)" and the verdict gate (which
          # requires a valid hash) would fail the very image we just fixed.
          # The ROM itself never checks the digest under SIMPLE_BOOT.
          # ------------------------------------------------------------------
          cat > /tmp/patch_zero_segs.py <<'PATCH_ZERO_SEGS'
          """Repoint zero-load-address PADDING segments at scratch DRAM.

          Why not delete them: esptool write_flash streams the .bin
          sequentially and the *file offsets* are what keep the later
          flash-mapped segments on their required 64 KB MMU pages.
          Why the sanity check: a la=0 segment whose payload is NOT all
          zeros is not padding -- refuse to touch it.
          """
          import hashlib
          import struct
          import sys

          SCRATCH_BASE = 0x3FC88000  # SRAM_DRAM_START; .dram0.data at 0x3FC9xxxx
          SCRATCH_LIMIT = 0x3FC90000  # hard stop before .dram0.data origin


          def parse(path):
              data = bytearray(open(path, "rb").read())
              if len(data) < 24 or data[0] != 0xE9:
                  raise SystemExit("bad magic/size -- not an ESP firmware image")
              n = data[1]
              off = 24
              entries = []
              for i in range(n):
                  if off + 8 > len(data):
                      raise SystemExit("truncated segment header %d" % i)
                  la, ln = struct.unpack_from("<II", data, off)
                  if off + 8 + ln > len(data):
                      raise SystemExit("segment %d data truncated" % i)
                  entries.append((i, off, la, ln))
                  off += 8 + ln
              return data, entries


          def main(src, dst):
              data, entries = parse(src)
              scratch = SCRATCH_BASE
              fixed = []
              for i, off, la, ln in entries:
                  if la != 0:
                      continue
                  payload = data[off + 8: off + 8 + ln]
                  if any(payload):
                      raise SystemExit(
                          "seg%d la=0 but payload is not all zeros "
                          "-- NOT padding, refusing to patch" % i)
                  struct.pack_into("<I", data, off, scratch)
                  fixed.append((i, ln, scratch))
                  scratch += ln
              if not fixed:
                  print("no zero-load-address segments; nothing to do")
              else:
                  for i, ln, addr in fixed:
                      print("  seg%d: load 0x00000000 -> 0x%08x "
                            "(len 0x%x, all zeros)" % (i, addr, ln))
                  if scratch > SCRATCH_LIMIT:
                      raise SystemExit(
                          "scratch overflow 0x%08x -- would clobber .dram0.data"
                          % scratch)
              # Refresh the appended SHA-256 digest (last 32 bytes,
              # hash_appended flag is byte 23) so esptool image_info keeps
              # reporting "Validation Hash: (valid)".
              if data[23] & 1:
                  if len(data) < 56:
                      raise SystemExit("image too small for an appended digest")
                  doff = len(data) - 32
                  data[doff:] = hashlib.sha256(bytes(data[:doff])).digest()
                  print("  sha256 digest refreshed at 0x%x" % doff)
              open(dst, "wb").write(bytes(data))
              # Re-verify: re-parse the OUTPUT and count zero la segments.
              d2, e2 = parse(dst)
              bad = sum(1 for _, _, la, _ in e2 if la == 0)
              print("verify: segcount=%d zero_load_addr_segments=%d"
                    % (len(e2), bad))
              return 0 if bad == 0 else 1


          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.stdout.write(
                      "usage: patch_zero_segs.py <in.bin> <out.bin>\n")
                  sys.exit(2)
              sys.exit(main(sys.argv[1], sys.argv[2]))
          PATCH_ZERO_SEGS
          echo "patch_zero_segs.py generated: $(wc -l < /tmp/patch_zero_segs.py) lines" >> build.log
          export VELA_USE_MAKEFILE=1
          # Override the envsetup default (which appends -Werror): the official
          # esp32s3 chip layer (esp32s3_libc_stubs.c 'noreturn' warning) does not
          # compile cleanly under -Werror with this toolchain (run#22). The
          # Makefile path passes EXTRAFLAGS on every make call, so this export
          # fully replaces the default.
          export VELA_EXTRA_FLAGS="-Wno-cpp -Wno-deprecated-declarations"
          echo "VELA_USE_MAKEFILE=1 (force _do_makefile_build)" >> build.log
          echo "VELA_EXTRA_FLAGS=$VELA_EXTRA_FLAGS (no -Werror)" >> build.log
          # ------------------------------------------------------------------
          # run#54/#55 post-mortem.  run#54 built fine but was reported as a
          # failed step; that was the `ls ... 2>/dev/null` diagnostic tripping
          # `bash -e` (2>/dev/null silences output, NOT the exit code).
          # run#55 added `|| true` to that line -- the `ls` output duly
          # appeared in build.log -- yet the step STILL reported failure, and
          # neither the "BUILD OK" nor the "BUILD FAILED" verdict line was
          # written.  So the step is being killed by `-e` somewhere we cannot
          # see, and no amount of per-line guarding has proven reliable.
          #
          # Stop fighting the shell.  The whole build+verdict sequence now runs
          # inside an explicit subshell with `set +e`, and it communicates its
          # result OUT-OF-BAND through a marker file instead of through its
          # exit status.  `run:` can then always end 0, and the separate
          # "Decide build outcome" step below turns the marker into the real
          # pass/fail signal.  Nothing about the build can be lost to a
          # shell-option interaction again.
          # ------------------------------------------------------------------
          (
            set +e
            set -o pipefail
            rc=127
            # ------------------------------------------------------------------
            # MKIMAGE forensics: prove whether --ram-only-header is really on
            # the elf2image command line.  tools/esp32s3/Config.mk builds
            # ELF2IMAGE_OPTS conditionally on CONFIG_ESPRESSIF_SIMPLE_BOOT; if
            # that symbol is off, the flag is dropped.  run52's image has
            # segcount=5 with a DROM+IROM segment visible in the header, which
            # is what a NON-ram-only image looks like -- so we need the actual
            # file and the actual variable definitions in the log.
            # Real path after `repo sync` (manifest: <project path="nuttx"
            # name="nuttx">, file inside it at tools/esp32s3/Config.mk).
            # ------------------------------------------------------------------
            echo "== MKIMAGE opts as seen by make ==" >> build.log
            found_cfg=""
            for p in \
                nuttx/tools/esp32s3/Config.mk \
                nuttx/../vendor/espressif/tools/esp32s3/Config.mk
            do
              if [ -f "$p" ]; then
                echo "-> found Config.mk at: $p" >> build.log
                found_cfg="$p"
                break
              fi
            done
            if [ -n "$found_cfg" ]; then
              grep -nE 'ELF2IMAGE_OPTS|ESPTOOL_FLASH_OPTS|ram-only-header|ESPTOOL_FLASH_OPTS|MKIMAGE' \
                "$found_cfg" >> build.log 2>&1 || true
            else
              echo "Config.mk not found at nuttx/tools/esp32s3/Config.mk" >> build.log
            fi
            echo "== SIMPLE_BOOT symbol as the build sees it ==" >> build.log
            grep -nE 'ESP32S3_APP_FORMAT|ESPRESSIF_SIMPLE_BOOT' nuttx/.config >> build.log 2>&1 || true
            m -j"$(nproc)" 2>&1 | tee -a build.log
            rc=$?
            # Capture the EXACT elf2image invocation (post-expansion) so we can
            # see --ram-only-header present or absent.
            echo "== elf2image command line (from make's own output) ==" >> build.log
            # run#61: this used to be `grep -nE 'elf2image' build.log >> build.log`.
            # A file can never be both grep's input and its >> output -- GNU grep
            # refuses with "grep: build.log: input file is also the output" and
            # emits NOTHING.  So this forensics block has never once reported the
            # real command line; the only elf2image text in our logs came from a
            # line-numbered `grep -n` of Config.mk further up (which is a static
            # source listing, NOT the post-expansion invocation).
            # Grep into a temp file, then append that.
            grep -nE 'elf2image' build.log > /tmp/elf2image_hits.txt 2>&1 || true
            cat /tmp/elf2image_hits.txt >> build.log
            # The decisive line: the post-expansion value of the option list.
            # Read it straight out of Config.mk with sed instead of shelling out
            # to `make` with a heredoc -- a heredoc inside a YAML block scalar
            # needs every line indented to the same column, which is exactly the
            # kind of fragility that has already cost us runs.  We only need to
            # know whether --ram-only-header is still reachable, and under which
            # symbol, so a textual read is sufficient and cannot break YAML.
            echo "== ELF2IMAGE_OPTS definition (with line numbers) ==" >> build.log
            grep -n 'ELF2IMAGE_OPTS' nuttx/tools/esp32s3/Config.mk >> build.log 2>&1 || true
            echo "== ram-only-header reachability ==" >> build.log
            if grep -q 'ram-only-header' nuttx/tools/esp32s3/Config.mk; then
              echo "PRESENT: Config.mk still references --ram-only-header" >> build.log
              echo "         (patch 0002 did NOT apply -> expect segcount != 5)" >> build.log
            else
              echo "ABSENT: --ram-only-header is gone from Config.mk (patch 0002 applied)" >> build.log
            fi
            echo "== CONFIG_ESPRESSIF_SIMPLE_BOOT as the build sees it ==" >> build.log
            grep -n 'ESPRESSIF_SIMPLE_BOOT' nuttx/.config >> build.log 2>&1 || echo "  (symbol not set)" >> build.log
            echo "M-CHAIN rc=$rc" >> build.log
            ls -la nuttx/nuttx nuttx/nuttx.bin >> build.log 2>&1
            # ----------------------------------------------------------------
            # ZERO-LOAD-ADDR RELOCATION, executed in place on the image make
            # just produced (script generated in part 1/3 above; rationale in
            # its header).  Runs BEFORE the verdict step re-parses the image
            # so the zero-addr gate judges the SHIPPING image, not the raw
            # elf2image output.  parse() reads the whole file before the
            # write, so src == dst is safe.  Failure here is logged and left
            # to the gate: segcheck will still see la=0 and fail the verdict,
            # so a broken relocation can never ship silently.
            # ----------------------------------------------------------------
            if [ -f nuttx/nuttx.bin ] && [ -f /tmp/patch_zero_segs.py ]; then
              echo "== ZERO-LOAD-ADDR RELOCATION (in-place on nuttx/nuttx.bin) ==" >> build.log
              python3 /tmp/patch_zero_segs.py nuttx/nuttx.bin nuttx/nuttx.bin >> build.log 2>&1 \
                || echo "== relocation reported failure (rc=$?) -- see lines above; the zero-addr gate will judge the result" >> build.log
              if [ -f /tmp/segcheck.py ]; then
                echo "== segcheck after relocation ==" >> build.log
                python3 /tmp/segcheck.py nuttx/nuttx.bin >> build.log 2>&1 \
                  || echo "== post-relocation segcheck rc=$? (see lines above)" >> build.log
              fi
            else
              echo "== relocation skipped: nuttx.bin or /tmp/patch_zero_segs.py missing ==" >> build.log
            fi
            echo "$rc" > build_rc.txt
          ) >> build.log 2>&1
          # This step always "succeeds" -- see the verdict step below.
          exit 0

      - name: Decide build outcome
        id: verdict
        working-directory: openvela
        run: |
          # Reads the marker the build step wrote, then re-checks the artifact
          # independently.  This is the ONLY place the build's pass/fail is
          # decided, so a shell quirk in the build step cannot mark a good
          # build as failed (or a bad one as good).
          rc="$(cat build_rc.txt 2>/dev/null || echo MISSING)"
          echo "build_rc.txt says: $rc" >> build.log
          if [ "$rc" = "MISSING" ]; then
            echo "== BUILD FAILED: build step did not write build_rc.txt ==" >> build.log
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "== BUILD FAILED: m chain exited $rc ==" >> build.log
            exit 1
          fi
          if [ ! -s nuttx/nuttx.bin ]; then
            echo "== BUILD FAILED: m exited 0 but nuttx/nuttx.bin is missing/empty ==" >> build.log
            exit 1
          fi
          # Verify it really is an ESP32-S3 image: first byte 0xE9 is
          # esp_image_header_t.magic.  Use `od` output captured to a variable
          # rather than a pipeline inside `[ ]`, which is fragile under -e.
          first_byte="$(od -An -tx1 -N1 nuttx/nuttx.bin | tr -d ' \n')"
          if [ "$first_byte" != "e9" ]; then
            echo "== BUILD FAILED: nuttx.bin first byte is '$first_byte', expected 'e9' ==" >> build.log
            exit 1
          fi
          size="$(stat -c%s nuttx/nuttx.bin)"
          # ------------------------------------------------------------------
          # BOOTABILITY GATE (2026-09-17, REVISED AGAIN -- esptool is the judge).
          #
          # Everything above only proves that *an* ESP32-S3 image was produced.
          # It does not prove the image can boot.  The real-device fact is:
          #
          #   zero IROM/DROM segments  ->  0 serial bytes, ROM never starts the
          #                                app (run#67: 2 segments, all RAM,
          #                                serial produced 0 bytes)
          #   a healthy image          ->  boots normally
          #
          # HISTORY OF WRONG JUDGEMENTS (all disproved -- do not reintroduce):
          #   1) "segcount == 5" -- run#68 drew SIX segments.  The COUNT is
          #      still not the predictor, but the reason this comment used to
          #      give was WRONG.  It claimed the two load_addr==0 segments were
          #      harmless, "PADDING segments emitted by NuttX's own
          #      esp_loader.c (`#define IS_PADD(addr) (addr == 0)`) yet
          #      structurally healthy".  Flashing run#68 to a real board
          #      disproved that on 2026-09-17:
          #          load:0x00000000,len:0x1528
          #          Guru Meditation Error: Core 0 panic'ed (StoreProhibited)
          #          EXCVADDR: 0x00000000
          #          A12     : 0x00001528     <-- == that segment's length
          #          Backtrace: 0x40045abc ...   (all in ROM)
          #      then endless TG0WDT_SYS_RST reboots.  IS_PADD() belongs to
          #      NuttX's own SECONDARY loader; SIMPLE_BOOT has none, so the
          #      ROM parses this image and does NOT skip the segment.  A zero
          #      load address is a HARD FAILURE -- see the ZERO-ADDR GATE.
          #   2) "classify load_addr against a hand-written map" -- a
          #      hand-rolled window table mislabelled the ESP32-S3 DRAM window
          #      0x3FC80000-0x3FD00000 as "DROM-low".  It is NOT DROM: esptool
          #      reports every 0x3fc8.. / 0x3fc9.. segment (run#52 0x3fca7230,
          #      run#55/67/68 0x3fc9xxxx) as [BYTE_ACCESSIBLE,MEM_INTERNAL,DRAM].
          #      That mislabel made run#55/67 (the black-screen images) look like
          #      they had a DROM and only failed by luck on the IROM check.
          #      NEVER hand-write a chip memory map -- ask esptool.
          #
          # THE JUDGE: `esptool image_info` prints each segment with its OFFICIAL
          # per-chip type token from esptool's own segment definitions:
          # [IROM] / [DROM] / [PADDING] / [MEM_INTERNAL,IRAM] /
          # [BYTE_ACCESSIBLE,MEM_INTERNAL,DRAM].  We require:
          #   (a) >= 1 [IROM] segment AND >= 1 [DROM] segment  (a flash-mapped
          #       ROM-visible segment must exist for the ROM to XIP-map)
          #   (b) a `Validation Hash: ... (valid)` line.  A --ram-only-header
          #       image omits the SHA256 appended digest entirely, so esptool
          #       prints NO Validation Hash line (run#55/67) -- this is the
          #       DIRECT fingerprint of --ram-only-header, stronger than any
          #       segment count because it checks the image trailer.
          # If the esptool call itself fails (rc != 0), the gate FAILS -- a
          # broken tool must never let an unproven image through.
          #
          # A --ram-only-header image is what tools/esp32s3/Config.mk emits
          # whenever CONFIG_ESPRESSIF_SIMPLE_BOOT=y; its tool output literally
          # says "Image has only RAM segments visible. ROM segments are
          # hidden."  The ROM bootloader then has no segment to XIP-map and
          # refuses to hand over -> the black screen / zero serial bytes the
          # user reported.  The nuttx patch 0002 exists to drop that flag, but
          # if the patch loop silently fails to run we would ship a perfectly
          # "green" build that bricks.
          #
          # Ground-truth esptool classifications (the runner installs esptool
          # 4.8.1 above; the invocation below matches that, `python3 -m esptool`):
          #
          #   run#52 (boots OK, 5 seg): [DROM] 0x3c090020, [DRAM] 0x3fca7230,
          #     [IRAM] 0x40374000, [IROM] 0x42000020, [IRAM] 0x40375b38
          #     + Validation Hash: (valid)
          #   run#67 (BLACK SCREEN, 2 seg): [DRAM] 0x3fc9a350, [IRAM] 0x40374000
          #     -- no IROM, no DROM, NO Validation Hash line
          #   run#68/69 (6 seg, BRICKS ON REAL HARDWARE while passing every
          #     check above): [DRAM] 0x3fc9b180, [IRAM] 0x40374000,
          #     [PADDING] 0x0 (len 0x1528), [DROM] 0x3c010000,
          #     [PADDING] 0x0 (len 0x4678), [IROM] 0x42040000
          #     + Validation Hash: (valid)
          #     -> [IROM] + [DROM] + a valid hash are NOT sufficient.  Only
          #        the ZERO-ADDR GATE below catches this image.
          # ------------------------------------------------------------------
          # Invoke esptool exactly as the rest of this workflow does
          # (`python3 -m esptool`, esptool 4.8.1 installed earlier); fall back
          # to a bare esptool.py if the module form is unavailable.
          # NOTE: GitHub runs `run:` blocks under `bash -e`, so a bare
          # `x="$(cmd)"; rc=$?` would abort on a non-zero cmd before we can
          # read rc.  Use the `|| rc=$?` idiom so -e never trips here and the
          # gate decides for itself (a dead tool must FAIL the gate, not skip).
          esptool_info=""
          esptool_rc=0
          esptool_info="$(python3 -m esptool --chip esp32s3 image_info nuttx/nuttx.bin 2>&1)" || esptool_rc=$?
          if [ "$esptool_rc" -ne 0 ]; then
            esptool_info="$(esptool.py --chip esp32s3 image_info nuttx/nuttx.bin 2>&1)" || esptool_rc=$?
          fi
          echo "== BOOTABILITY GATE: esptool image_info (rc=$esptool_rc) ==" >> build.log
          printf '%s\n' "$esptool_info" >> build.log
          irom="$(printf '%s\n' "$esptool_info" | grep -c '\[IROM\]')" || true
          drom="$(printf '%s\n' "$esptool_info" | grep -c '\[DROM\]')" || true
          vhash="$(printf '%s\n' "$esptool_info" | grep -c 'Validation Hash:.*(valid)')" || true
          echo "BOOTABILITY GATE: esptool_rc=$esptool_rc irom=$irom drom=$drom validation_hash=$vhash" >> build.log
          # ------------------------------------------------------------------
          # ZERO-LOAD-ADDRESS GATE, part 2/3 -- the verdict gate, HARD FAIL.
          # Full rationale and the hardware capture are in part 1/3 (build
          # step).  Short version: a segment whose load address is 0 is NOT
          # padding the ROM skips.  run#68/#69 (787632 bytes, md5
          # 71e92552cc0fe0f73a3147a6cca5a8ae) HAVE [IROM], [DROM] and a VALID
          # Validation Hash -- every check above passes -- and still brick
          # with StoreProhibited / EXCVADDR 0x00000000.  So the esptool
          # checks above cannot catch this alone; this check does.
          #
          # /tmp/segcheck.py parses the ESP image header itself and rejects
          # the image when ANY segment has load address 0, or when there are
          # fewer than 3 segments.  The >= 3 floor is belt and braces: both
          # known-bad families had 2 segments or 6-with-zeros, while a
          # healthy image here carries 5-6.  6 healthy segments are
          # legitimate, so this is deliberately a FLOOR and NOT a
          # `segcount == 5` requirement -- do not reintroduce that.
          # ------------------------------------------------------------------
          zeroaddr_rc=0
          seg_n=-1
          seg_zero=-1
          if [ ! -f /tmp/segcheck.py ]; then
            echo "== BUILD FAILED: ZERO-ADDR GATE -- /tmp/segcheck.py is missing ==" >> build.log
            echo "   The build step must generate it (part 1/3) before this gate." >> build.log
            echo "   Without it no image can be proven free of zero load-address" >> build.log
            echo "   segments, so the gate fails rather than guesses." >> build.log
            zeroaddr_rc=2
          else
            python3 /tmp/segcheck.py nuttx/nuttx.bin > /tmp/segcheck.out 2>&1 || zeroaddr_rc=$?
            echo "== ZERO-ADDR GATE: python3 /tmp/segcheck.py nuttx/nuttx.bin (rc=$zeroaddr_rc) ==" >> build.log
            tee -a build.log < /tmp/segcheck.out
            seg_n="$(sed -n 's/^SEGCOUNT=\([0-9][0-9]*\).*/\1/p' /tmp/segcheck.out 2>/dev/null | head -n1)" || true
            seg_zero="$(sed -n 's/^ZERO_LOAD_ADDR_SEGMENTS=\([0-9][0-9]*\).*/\1/p' /tmp/segcheck.out 2>/dev/null | head -n1)" || true
            : "${seg_n:=-1}"
            : "${seg_zero:=-1}"
          fi
          echo "ZERO-ADDR GATE: rc=$zeroaddr_rc segcount=${seg_n} zero_load_addr_segments=${seg_zero}" >> build.log
          if [ "$esptool_rc" -ne 0 ] || [ "${irom:-0}" -lt 1 ] || [ "${drom:-0}" -lt 1 ] || [ "${vhash:-0}" -lt 1 ] || [ "$zeroaddr_rc" -ne 0 ]; then
            echo "== BUILD FAILED: BOOTABILITY GATE -- image not provably bootable ==" >> build.log
            echo "   esptool_rc=$esptool_rc irom=$irom drom=$drom validation_hash=$vhash zeroaddr_rc=$zeroaddr_rc segcount=${seg_n} zero_load_addr_segments=${seg_zero}." >> build.log
            echo "   A bootable image needs >=1 [IROM], >=1 [DROM] and a" >> build.log
            echo "   'Validation Hash: ... (valid)' line (esptool's own per-chip" >> build.log
            echo "   segment classification -- do NOT hand-write address windows)." >> build.log
            echo "   Missing IROM/DROM or a missing Validation Hash is the" >> build.log
            echo "   --ram-only-header fingerprint (run#55/67: 2 all-RAM segments," >> build.log
            echo "   valid Checksum but NO Validation Hash, 0 serial bytes)." >> build.log
            echo "   Most likely --ram-only-header is still in" >> build.log
            echo "   nuttx/tools/esp32s3/Config.mk, meaning staging/patches/0002-*" >> build.log
            echo "   did not apply.  Check the 'NUTTX PATCH' lines in bsp.log; if none" >> build.log
            echo "   appear, the patch loop never executed and the PATCH CHECK gate" >> build.log
            echo "   was skipped with it." >> build.log
            if [ "$zeroaddr_rc" -ne 0 ]; then
              echo "   ZERO-ADDR GATE FAILED (rc=$zeroaddr_rc, segcount=${seg_n}," >> build.log
              echo "   zero_load_addr_segments=${seg_zero}): at least one segment has" >> build.log
              echo "   load address 0.  THE ROM WILL FAULT ON IT.  This is not" >> build.log
              echo "   padding the ROM skips -- esp_loader.c's IS_PADD() belongs to" >> build.log
              echo "   NuttX's own secondary loader, and SIMPLE_BOOT means there is" >> build.log
              echo "   none: ESP-ROM:esp32s3-20210327 parses this image, copies" >> build.log
              echo "   data_len bytes to address 0 and takes StoreProhibited" >> build.log
              echo "   (EXCVADDR 0x00000000), then reboots forever on" >> build.log
              echo "   TG0WDT_SYS_RST.  esptool calling the segment [PADDING] only" >> build.log
              echo "   reflects its own 0x00000000-0x00010000 MEMORY_MAP entry." >> build.log
              echo "   These segments come from esptool elf2image MMU-page (64 KB)" >> build.log
              echo "   alignment padding (esptool/bin_image.py save(): pad_segment =" >> build.log
              echo "   ImageSegment(0, ...)), NOT from merge_bin and NOT from the" >> build.log
              echo "   linker -- the payload is literal 0x00 filler esptool makes up." >> build.log
              echo "   Fix belongs upstream of this file (elf2image options in" >> build.log
              echo "   nuttx/tools/esp32s3/Config.mk or the flash LMA layout);" >> build.log
              echo "   this gate only refuses to ship it." >> build.log
            fi
            if [ "$seg_n" -ge 0 ] && [ "$seg_n" -lt 3 ]; then
              echo "   SEGMENT COUNT FLOOR FAILED: segcount=${seg_n} < 3.  A healthy" >> build.log
              echo "   image here has 5-6 segments; 2 is the --ram-only-header" >> build.log
              echo "   fingerprint (run#55/67, 0 serial bytes)." >> build.log
            fi
            echo "   --- full ESP segment table (all segments, all load addresses) ---" >> build.log
            if [ -f /tmp/segcheck.out ]; then
              cat /tmp/segcheck.out >> build.log
            else
              echo "   (segment table unavailable: /tmp/segcheck.out not produced)" >> build.log
            fi
            echo "   --- esptool image_info output follows ---" >> build.log
            printf '%s\n' "$esptool_info" >> build.log
            exit 1
          fi
          echo "BUILD OK: nuttx/nuttx.bin present (${size} bytes, magic 0xE9, m rc=$rc, irom=$irom drom=$drom vhash=$vhash, segcount=${seg_n}, zero_load_addr_segments=${seg_zero}, zeroaddr_rc=$zeroaddr_rc)" >> build.log
          ls -la nuttx/nuttx nuttx/nuttx.bin >> build.log 2>&1

      - name: Collect firmware
        if: always()
        working-directory: openvela
        run: |
          # Everything Collect does is written to openvela/collect.log so the
          # logs branch (which copies collect.log) shows exactly what happened.
          # Without this the step's own output never reached build.log and we
          # could not tell WHY nuttx.map / the ELF were missing from the
          # uploaded artifacts.
          {
          mkdir -p firmware
          echo "== Collect: cwd = $PWD =="
          echo "== Collect: staging dir =="
          ls -la firmware || true
          # SIMPLE_BOOT build: NuttX is loaded straight from the ROM, so the
          # ONLY artifact is nuttx.bin and it is flashed at offset 0x0.
          # There is no 2nd-stage bootloader and no generated partition table,
          # so there is nothing to merge -- an earlier revision of this step
          # shelled out to `esptool merge_bin` for a bootloader + partition
          # table + app trio, which no longer exists.
          echo "== Collect: binlist =="
          find nuttx -name '*.bin' -exec ls -la {} \; 2>&1 || true
          find nuttx -name '*.bin' -exec ls -la {} \; > binlist.txt 2>&1 || true
          tail -c 3000 binlist.txt || true
          find nuttx -name 'nuttx.bin' -exec cp -v {} firmware/ \; 2>/dev/null || true
          # ELF + map: without these, a crash PC can only be disassembled and
          # guessed at -- with nuttx.map (or the ELF) we can run
          #   xtensa-esp32s3-elf-addr2line -e nuttx <PC>
          # and land on the exact source line.  Ship them with the firmware.
          echo "== Collect: ELF =="
          ls -la nuttx/nuttx 2>&1 || echo "  (no nuttx ELF at nuttx/nuttx)"
          find nuttx -maxdepth 1 -name 'nuttx' -exec cp -v {} firmware/ \; 2>&1 || true
          # The map file is NOT always named nuttx.map: `tools/Unix.mk` globs
          # whatever *.map the link produced into nuttx.manifest, and on this
          # arch the only map emitted by default is User.map (protected build)
          # or none at all when CONFIG_DEBUG_LINK_MAP is off.  Do not assume the
          # name -- enumerate every *.map and copy them all.
          echo "== Collect: map files (any *.map under nuttx/) =="
          find nuttx -name '*.map' -exec ls -la {} \; 2>&1 || echo "  (no *.map found anywhere under nuttx/)"
          find nuttx -maxdepth 1 -name '*.map' -exec cp -v {} firmware/ \; 2>&1 || true
          echo "== Collect: nuttx.manifest (the build's own artifact list) =="
          ls -la nuttx/nuttx.manifest 2>&1 || echo "  (no nuttx/nuttx.manifest)"
          cat nuttx/nuttx.manifest 2>&1 || true
          # Self-describing artifact: sha256 + segment structure.  If the board
          # ever behaves differently from what this says, the problem is
          # downstream of CI.
          sha256sum nuttx/nuttx.bin > firmware/nuttx.bin.sha256 2>/dev/null || true
          cp -v binlist.txt firmware/ 2>&1 || true
          # The Publish step runs only on success and the logs branch only on
          # failure, so ship the build.log tail WITH the firmware itself
          # (Collect runs `if: always()`).
          tail -c 3000000 build.log > firmware/build_tail.log 2>/dev/null || true
          # Prove which boot path this image was built for.  ESSPRESSIF_
          # SIMPLE_BOOT=y (and no APP_FORMAT_*) means ROM direct boot, which is
          # what makes offset 0x0 correct.  If this block ever shows an
          # APP_FORMAT, the flashing offset changes -- do not ignore it.
          { echo ""
            echo "== BOOT FORMAT IN .config (nuttx.bin must be flashed at 0x0) =="
            grep -E 'APP_FORMAT|SIMPLE_BOOT|PARTITION_TABLE_OFFSET|KERNEL_OFFSET' nuttx/.config \
              || echo "  (no boot-format symbols found)"
            echo ""
            echo "== nuttx.bin =="
            ls -la nuttx/nuttx.bin 2>/dev/null || echo "  MISSING"
          } >> firmware/build_tail.log
          echo "== Collect: SEGMENT TABLE (bootability gate) =="
          # 2026-09-17 real-device A/B, REVISED AGAIN -- esptool is the judge.
          # TWO earlier judgements were WRONG:
          #   1) "segcount == 5": run#68 drew 6 segments -- count is still not
          #      the predictor, BUT "the two load_addr==0 segments are harmless
          #      PADDING and the image is healthy" was WRONG (2026-09-17):
          #      flashed to a real board it panics with StoreProhibited /
          #      EXCVADDR 0x00000000 on the first zero segment (len 0x1528 ==
          #      A12 in the register dump) and reboots forever.  Zero load
          #      address == HARD FAIL; see the ZERO-ADDR GATE part 1/3 in the
          #      build step.
          #   2) hand-written address windows: 0x3FC80000-0x3FD00000 was wrongly
          #      called "DROM-low" -- it is DRAM.  esptool classifies every
          #      0x3fc8.. / 0x3fc9.. segment as [BYTE_ACCESSIBLE,MEM_INTERNAL,
          #      DRAM] (run#52 0x3fca7230, run#55/67/68 0x3fc9xxxx).  That
          #      mislabel made the black-screen images look like they had a DROM.
          #      NEVER hand-write a chip memory map -- ask esptool.
          #
          # Real A/B ground truth (esptool's official per-chip classification):
          #   run#67 (black screen, 0 serial bytes): 2 segments
          #     [BYTE_ACCESSIBLE,MEM_INTERNAL,DRAM] + [MEM_INTERNAL,IRAM]
          #     -> no [IROM], no [DROM]; Checksum valid but NO Validation Hash
          #        line == the --ram-only-header fingerprint.
          #   run#52 (boots cleanly): [DROM],[DRAM],[IRAM],[IROM],[IRAM]
          #     + Validation Hash: (valid).
          #   run#68/69 (6 seg, BRICKS ON REAL HARDWARE while passing all of
          #     the above): [DRAM],[IRAM],[PADDING] 0x0 (len 0x1528),[DROM],
          #     [PADDING] 0x0 (len 0x4678),[IROM] + Validation Hash: (valid).
          #     -> so [IROM] + [DROM] + valid hash are NOT sufficient; the
          #        ZERO-ADDR GATE below is what actually catches it.
          # Gate: require >=1 [IROM] AND >=1 [DROM] AND a 'Validation Hash:
          # ... (valid)' line.  If esptool itself fails (rc != 0), treat it as
          # a gate failure (never pass an unproven image because a tool died).
          # `|| rc=$?` idiom + `|| true` on grep keep this safe under `bash -e`
          # (GitHub's default) so a non-zero status never aborts the step here.
          esptool_info=""
          esptool_rc=0
          esptool_info="$(python3 -m esptool --chip esp32s3 image_info nuttx/nuttx.bin 2>&1)" || esptool_rc=$?
          if [ "$esptool_rc" -ne 0 ]; then
            esptool_info="$(esptool.py --chip esp32s3 image_info nuttx/nuttx.bin 2>&1)" || esptool_rc=$?
          fi
          echo "== esptool image_info (rc=$esptool_rc) =="
          printf '%s\n' "$esptool_info"
          irom="$(printf '%s\n' "$esptool_info" | grep -c '\[IROM\]')" || true
          drom="$(printf '%s\n' "$esptool_info" | grep -c '\[DROM\]')" || true
          vhash="$(printf '%s\n' "$esptool_info" | grep -c 'Validation Hash:.*(valid)')" || true
          echo "esptool_rc=$esptool_rc irom=$irom drom=$drom validation_hash=$vhash (need >=1 each)"
          # ------------------------------------------------------------------
          # ZERO-LOAD-ADDRESS GATE, part 3/3 -- Collect.
          # Same checker, same rules as the verdict gate (part 2/3); rationale
          # and the hardware capture are in part 1/3 (build step).
          # A segment with load address 0 makes ESP-ROM:esp32s3-20210327 copy
          # data_len bytes to address 0 -> StoreProhibited, EXCVADDR
          # 0x00000000, endless TG0WDT_SYS_RST reboots.  run#68/#69 prove
          # [IROM] + [DROM] + a VALID Validation Hash are not enough to catch
          # it, so this runs in addition to the esptool checks.
          # Also enforces the >= 3 segment floor (2 == the --ram-only-header
          # fingerprint).  6 healthy segments are fine; this is a floor, NOT
          # `segcount == 5`.
          # Non-fatal here on purpose -- the verdict step decides pass/fail,
          # and Collect still stages the binary for inspection.
          # ------------------------------------------------------------------
          zeroaddr_rc=0
          seg_n=-1
          seg_zero=-1
          if [ ! -f /tmp/segcheck.py ]; then
            echo "== ZERO-ADDR GATE FAILED: /tmp/segcheck.py missing (build step did not generate it) =="
            zeroaddr_rc=2
          else
            python3 /tmp/segcheck.py nuttx/nuttx.bin > /tmp/segcheck.out 2>&1 || zeroaddr_rc=$?
            echo "== ZERO-ADDR GATE: python3 /tmp/segcheck.py nuttx/nuttx.bin (rc=$zeroaddr_rc) =="
            tee -a build.log < /tmp/segcheck.out
            seg_n="$(sed -n 's/^SEGCOUNT=\([0-9][0-9]*\).*/\1/p' /tmp/segcheck.out 2>/dev/null | head -n1)" || true
            seg_zero="$(sed -n 's/^ZERO_LOAD_ADDR_SEGMENTS=\([0-9][0-9]*\).*/\1/p' /tmp/segcheck.out 2>/dev/null | head -n1)" || true
            : "${seg_n:=-1}"
            : "${seg_zero:=-1}"
          fi
          echo "zeroaddr_rc=$zeroaddr_rc segcount=${seg_n} zero_load_addr_segments=${seg_zero} (need rc=0, segcount>=3 and 0 zero segments)"
          { echo "esptool_rc=$esptool_rc"
            echo "irom=$irom"
            echo "drom=$drom"
            echo "validation_hash=$vhash"
            echo "zeroaddr_rc=$zeroaddr_rc"
            echo "segcount=${seg_n}"
            echo "zero_load_addr_segments=${seg_zero}"
            printf '%s\n' "$esptool_info"
          } > segcount.txt
          if [ -f /tmp/segcheck.out ]; then
            { echo "== full ESP segment table =="
              cat /tmp/segcheck.out
            } >> segcount.txt
          fi
          if [ "$esptool_rc" -ne 0 ] || [ "${irom:-0}" -lt 1 ] || [ "${drom:-0}" -lt 1 ] || [ "${vhash:-0}" -lt 1 ] || [ "$zeroaddr_rc" -ne 0 ]; then
            echo "== BOOTABILITY GATE FAILED: image not provably bootable =="
            echo "   esptool_rc=$esptool_rc irom=$irom drom=$drom validation_hash=$vhash zeroaddr_rc=$zeroaddr_rc segcount=${seg_n} zero_load_addr_segments=${seg_zero}."
            echo "   A bootable image needs >=1 [IROM], >=1 [DROM] and a"
            echo "   'Validation Hash: ... (valid)' line (esptool's own per-chip"
            echo "   segment classification -- do NOT hand-write address windows)."
            echo "   Missing IROM/DROM or a missing Validation Hash is the"
            echo "   --ram-only-header fingerprint (run#55/67: 2 all-RAM segments,"
            echo "   valid Checksum but NO Validation Hash, 0 serial bytes,"
            echo "   verified on hardware 2026-09-17)."
            echo "   Usual cause: --ram-only-header still present in"
            echo "   nuttx/tools/esp32s3/Config.mk because the nuttx patch loop"
            echo "   did not run.  See BSP SECTION 2/3 in bsp.log."
            if [ "$zeroaddr_rc" -ne 0 ]; then
              echo "   ZERO-ADDR GATE FAILED (rc=$zeroaddr_rc, segcount=${seg_n},"
              echo "   zero_load_addr_segments=${seg_zero}): a segment has load"
              echo "   address 0 and THE ROM WILL FAULT ON IT -- StoreProhibited,"
              echo "   EXCVADDR 0x00000000, then endless TG0WDT_SYS_RST reboots."
              echo "   esp_loader.c's IS_PADD() is NuttX's own secondary loader;"
              echo "   SIMPLE_BOOT has none, so ESP-ROM:esp32s3-20210327 parses"
              echo "   this image itself and does NOT skip the segment.  esptool's"
              echo "   [PADDING] label is just its 0x00000000-0x00010000 MEMORY_MAP"
              echo "   entry.  Origin: esptool elf2image 64 KB MMU-page alignment"
              echo "   padding (esptool/bin_image.py save(): pad_segment ="
              echo "   ImageSegment(0, ...)) -- not merge_bin, not the linker."
            fi
            if [ "$seg_n" -ge 0 ] && [ "$seg_n" -lt 3 ]; then
              echo "   SEGMENT COUNT FLOOR FAILED: segcount=${seg_n} < 3 (healthy"
              echo "   images here have 5-6; 2 == --ram-only-header fingerprint)."
            fi
            echo "   NOT a hard failure here on purpose -- the verdict step decides,"
            echo "   so Collect still stages the binary for inspection."
            echo "   --- full ESP segment table follows ---"
            if [ -f /tmp/segcheck.out ]; then
              cat /tmp/segcheck.out
            else
              echo "   (segment table unavailable: /tmp/segcheck.out not produced)"
            fi
            echo "   --- esptool image_info output follows ---"
            printf '%s\n' "$esptool_info"
          else
            echo "BOOTABILITY GATE OK: irom=$irom drom=$drom validation_hash=$vhash zeroaddr_rc=$zeroaddr_rc segcount=${seg_n} zero_load_addr_segments=${seg_zero}"
          fi
          cp -v segcount.txt firmware/ 2>&1 || true
          echo "== Collect: firmware/ contents =="
          ls -la firmware || true
          echo "== Collect: DONE =="
          } 2>&1 | tee collect.log

      - name: Publish firmware to firmware branch (SSH-pullable)
        # Gated on the ARTIFACT, not on step status.  run#54 taught us that a
        # successful build can still be reported as a failed step, and an
        # `if: success()` gate then strands a perfectly good nuttx.bin on the
        # runner forever.  Collect already ran (if: always()) and staged the
        # binary into openvela/firmware/, so publish whenever it is there.
        #
        # Publish whenever the verdict step PASSED and Collect staged the
        # binary.  `if: always()` is required because a failure in an earlier
        # step would otherwise skip this one even when the artifact is good --
        # but the verdict outcome is checked explicitly so we never ship an
        # image the verdict refused.  The 0xE9 magic is re-checked here too:
        # two independent gates, neither trusting a step's status alone.
        if: always()
        run: |
          if [ "${{ steps.verdict.outcome }}" != "success" ]; then
            echo "verdict was '${{ steps.verdict.outcome }}' -- refusing to publish"
            exit 0
          fi
          FW="${{ github.workspace }}/openvela/firmware/nuttx.bin"
          if ! ls "$FW" >/dev/null 2>&1; then
            echo "no nuttx.bin staged by Collect -- nothing to publish"
            exit 0
          fi
          magic=$(od -An -tx1 -N1 "$FW" | tr -d ' \n')
          if [ "$magic" != "e9" ]; then
            echo "staged nuttx.bin has magic '$magic', not 'e9' -- refusing to publish"
            exit 0
          fi
          echo "publishing nuttx.bin ($(stat -c%s "$FW") bytes, magic 0xE9); verdict was '${{ steps.verdict.outcome }}'"
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/fw && cd /tmp/fw
          git init -q -b firmware .
          cp "${{ github.workspace }}/openvela/firmware/"* .
          # Also ship bsp.log on SUCCESS: it is the only proof that the patches
          # actually landed (PATCH CHECK OK / PATCH VERIFY OK / the elf2image
          # command line).  Without it we cannot confirm a 5-segment image was
          # produced by a patched tree rather than an unpatched one.
          cp "${{ github.workspace }}/bsp.log" ./bsp.log 2>/dev/null || echo "no bsp.log" > bsp.log
          git add -A
          git commit -q -m "firmware build run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin firmware --force
          echo "固件已推送到 firmware 分支"

      - name: Publish build log to logs branch on failure
        if: failure()
        run: |
          # Step-level forensics (run#36 died with zero logs: which step?):
          echo "=== STEP OUTCOMES ===" | tee step_outcomes.txt
          echo "deps: ${{ steps.deps.outcome }}" | tee -a step_outcomes.txt
          echo "toolchain: ${{ steps.toolchain.outcome }}" | tee -a step_outcomes.txt
          echo "sync: ${{ steps.sync.outcome }}" | tee -a step_outcomes.txt
          echo "bsp: ${{ steps.bsp.outcome }}" | tee -a step_outcomes.txt
          echo "build: ${{ steps.build.outcome }} (always success by design; see verdict)" | tee -a step_outcomes.txt
          echo "verdict: ${{ steps.verdict.outcome }}" | tee -a step_outcomes.txt
          tail -c 2000000 openvela/build.log > build_tail.log 2>/dev/null || echo "no build.log" > build_tail.log
          # bsp.log is the ONLY record of the BSP step's output.  run#58 and
          # run#59 both failed in that step and we were blind, because nothing
          # ever captured it -- build.log belongs to the NEXT step.  Ship it.
          #
          # run#65: this line read openvela/bsp.log, but the bsp step has NO
          # working-directory, so its `| tee bsp.log` (which runs BEFORE the
          # build step sets working-directory: openvela) lands at the WORKSPACE
          # ROOT.  Every failure therefore shipped the literal string
          # "no bsp.log" and we spent several rounds believing the patch loop
          # never ran -- we simply had no record of it either way.  Read from
          # the root, where it is actually written.
          tail -c 2000000 bsp.log > bsp_tail.log 2>/dev/null || echo "no bsp.log" > bsp_tail.log
          tail -c 2000000 openvela/sync.log > sync_tail.log 2>/dev/null || echo "no sync.log" > sync_tail.log
          tail -c 2000000 openvela/init.log > init_tail.log 2>/dev/null || echo "no init.log" > init_tail.log
          # A missing log must be LOUD.  The `|| echo "no bsp.log"` idiom above
          # is exactly how run#58..run#65 shipped a placeholder for two months
          # of debugging without anyone noticing the file was never found.
          # Fail loudly on stdout (visible in the Actions UI) while still
          # emitting a placeholder so the artifact set stays uniform.
          for f in bsp.log sync.log init.log; do
            if [ ! -s "${{ github.workspace }}/$f" ]; then
              echo "== LOG MISSING: $f not found at workspace root =="
              echo "(the step that writes it either never ran or wrote elsewhere)"
            fi
          done
          ls -la openvela > dirlist.txt 2>&1 || true
          git config --global user.email "ci@openvela-contest.local"
          git config --global user.name "OpenVela CI"
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b logs .
          cp "${{ github.workspace }}/step_outcomes.txt" .
          cp "${{ github.workspace }}/pip_esptool.log" . 2>/dev/null || true
          # run#48: the Collect step is not tracked by step_outcomes.txt
          # and its merge transcript used to be lost on failure -- ship it.
          cp "${{ github.workspace }}/openvela/collect.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/build_tail.log" .
          # run#61: bsp_tail.log was computed above but NEVER copied here --
          # the line was simply missing, so every failure shipped a logs branch
          # with no BSP record at all and we had to infer the BSP step's fate
          # from the outcome line alone.  Copy it.
          cp "${{ github.workspace }}/bsp_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/sync_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/init_tail.log" . 2>/dev/null || true
          cp "${{ github.workspace }}/dirlist.txt" . 2>/dev/null || true
          # run#54: a successful build whose step was mis-reported as failed
          # left the binary stranded.  Collect staged it into
          # openvela/firmware/ -- ship it here too, so the logs branch is
          # always a complete record (binary + log) no matter which publish
          # path fires.
          cp "${{ github.workspace }}/openvela/firmware/nuttx.bin" . 2>/dev/null || true
          # run#70/#72 forensics: ROM boots (all 6 segments, entry reached,
          # padding relocated) but the app spins in early IRAM init -- saved
          # PC 0x40374efb/0x40374f7d, inside the IRAM segment.  Resolving
          # that PC needs a symbol source, and the firmware branch only
          # publishes on the success path: on failure only nuttx.bin reached
          # this branch.  Ship the symbol material too -- the ELF is the
          # exact addr2line target, System.map is the 254 KB first resort,
          # nuttx.map (~10 MB) is the full symbol+section view, segcount.txt
          # carries the gate's own verdict for this very image.
          cp "${{ github.workspace }}/openvela/firmware/nuttx" . 2>/dev/null || true
          cp "${{ github.workspace }}/openvela/firmware/System.map" . 2>/dev/null || true
          cp "${{ github.workspace }}/openvela/firmware/nuttx.map" . 2>/dev/null || true
          cp "${{ github.workspace }}/openvela/firmware/nuttx.bin.sha256" . 2>/dev/null || true
          cp "${{ github.workspace }}/openvela/firmware/segcount.txt" . 2>/dev/null || true
          # The map name is NOT guaranteed (Collect copies every *.map the
          # link emitted -- User.map on protected builds, none otherwise).
          # nullglob keeps the loop a no-op instead of a literal-glob copy.
          shopt -s nullglob
          for m in "${{ github.workspace }}/openvela/firmware/"*.map; do
            cp -v "$m" . || true
          done
          shopt -u nullglob
          # Loud listing: a silent `|| true` above cost us run#65's bsp.log
          # for months -- show exactly which forensics files made it.
          echo "== logs branch forensics files =="
          ls -la nuttx.bin nuttx System.map nuttx.map segcount.txt 2>/dev/null || true
          git add -A
          git commit -q -m "build log run #${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin logs --force
          echo "日志已推送到 logs 分支"
